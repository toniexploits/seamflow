<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SeamFlow Business Systems Audit</title>
<style>
  :root{
    --navy:#021D4B;
    --navy-soft:#0C2C68;
    --gold:#EFCE58;
    --gold-light:#F8DE8A;
    --grey:#6B7280;
    --line:#E5E7EB;
    --bg:#FFFFFF;
    --panel:#F7F7F9;
    --danger:#C0392B;
    --warn:#F5A800;
    --ok:#1E8E5A;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:Calibri,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:#1A1A1A;}
  .app{max-width:760px;margin:0 auto;padding:0 0 60px;}

  .hdr{background:linear-gradient(135deg,var(--navy) 0%, var(--navy-soft) 100%);color:#fff;padding:26px 22px 22px;border-bottom:4px solid var(--gold);}
  .hdr .eyebrow{letter-spacing:2px;font-size:11px;font-weight:700;color:var(--gold-light);text-transform:uppercase;}
  .hdr h1{margin:6px 0 4px;font-size:21px;font-weight:700;line-height:1.25;}
  .hdr p{margin:0;font-size:13px;color:#C9D0E8;line-height:1.5;}
  .logo-img{display:block;max-width:280px;width:60%;height:auto;margin-bottom:14px;}

  .progress-wrap{padding:14px 22px 0;}
  .progress-track{height:6px;background:var(--line);border-radius:4px;overflow:hidden;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--gold) 0%, var(--gold-light) 100%);border-radius:4px;transition:width .3s ease;}
  .progress-label{display:flex;justify-content:space-between;font-size:11.5px;color:var(--grey);margin-top:6px;font-weight:600;}

  .panel{padding:24px 22px 8px;}
  .domain-tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--navy);background:#EFF1F8;border:1px solid var(--line);padding:4px 10px;border-radius:999px;margin-bottom:10px;}
  .question{margin-bottom:24px;}
  .q-text{font-size:15px;font-weight:600;margin-bottom:12px;line-height:1.45;}
  .scale{display:flex;flex-direction:column;gap:8px;}
  .opt{display:flex;align-items:flex-start;gap:12px;border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;transition:border-color .15s ease, background .15s ease;}
  .opt:hover{border-color:var(--gold-light);}
  .opt.selected{border-color:var(--gold);background:#FFFBF0;}
  .opt input{display:none;}
  .opt .dot{width:18px;height:18px;min-width:18px;border-radius:50%;border:2px solid var(--line);margin-top:2px;position:relative;}
  .opt.selected .dot{border-color:var(--gold);}
  .opt.selected .dot::after{content:"";position:absolute;top:3px;left:3px;width:8px;height:8px;border-radius:50%;background:var(--gold);}
  .opt-text{font-size:13.5px;line-height:1.4;color:#333;}

  .nav-row{display:flex;justify-content:space-between;gap:12px;padding:14px 22px 0;}
  .btn{border:none;border-radius:8px;padding:13px 20px;font-size:14.5px;font-weight:700;cursor:pointer;font-family:inherit;}
  .btn-primary{background:var(--navy);color:#fff;flex:1;}
  .btn-primary:disabled{background:#9AA3BE;cursor:not-allowed;}
  .btn-ghost{background:transparent;color:var(--navy);border:1.5px solid var(--line);}
  .btn-gold{background:var(--gold);color:var(--navy);}

  .intro{padding:26px 22px;}
  .intro h2{color:var(--navy);font-size:17px;margin:22px 0 10px;}
  .intro h2:first-child{margin-top:0;}
  .intro p{font-size:13.5px;color:#333;line-height:1.6;margin:0 0 14px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12.5px;font-weight:700;color:var(--navy);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px;}
  .field input, .field select{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;}

  .mode-card{border:1.5px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px;cursor:pointer;}
  .mode-card.selected{border-color:var(--gold);background:#FFFBF0;}
  .mode-card h4{margin:0 0 4px;color:var(--navy);font-size:14.5px;}
  .mode-card p{margin:0;font-size:12.5px;color:var(--grey);line-height:1.4;}

  .dept-grid{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;}
  .dept-check{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;font-size:13.5px;}
  .dept-check.on{border-color:var(--gold);background:#FFFBF0;}
  .dept-check input{width:16px;height:16px;accent-color:var(--gold);}

  .results{padding:8px 22px 10px;}
  .gauge-wrap{display:flex;flex-direction:column;align-items:center;padding:16px 0 6px;}
  .gauge-score{font-size:44px;font-weight:800;color:var(--navy);line-height:1;}
  .gauge-score span{font-size:18px;font-weight:700;color:var(--grey);}
  .gauge-label{font-size:12.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--gold);margin-top:6px;}
  .maturity-badge{margin-top:12px;padding:8px 16px;border-radius:999px;font-size:13px;font-weight:700;text-align:center;}
  .facility-name{font-size:13px;color:var(--grey);margin-top:4px;}

  .tier-card{margin:18px 0 22px;border:1.5px solid var(--navy);border-radius:12px;padding:18px;background:var(--panel);}
  .tier-card .tier-eyebrow{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--grey);}
  .tier-card h3{margin:4px 0 8px;color:var(--navy);font-size:18px;}
  .tier-card p{margin:0;font-size:13.5px;color:#333;line-height:1.55;}

  .plan-callout{margin:0 0 22px;border:1.5px solid var(--gold);border-radius:12px;padding:18px;background:linear-gradient(135deg, var(--navy) 0%, var(--navy-soft) 100%);}
  .plan-callout .tier-eyebrow{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--gold-light);}
  .plan-callout h3{margin:4px 0 8px;color:#fff;font-size:19px;}
  .plan-callout p{margin:0;font-size:13.5px;color:#D9DEEE;line-height:1.55;}

  .domain-bar-row{margin-bottom:14px;}
  .domain-bar-head{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--navy);margin-bottom:6px;}
  .domain-bar-head .pct{color:var(--grey);font-weight:700;}
  .bar-track{height:9px;background:var(--line);border-radius:6px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:6px;}

  .priority-box{border-left:4px solid var(--danger);background:#FBEEEC;padding:14px 16px;border-radius:6px;margin:18px 0;}
  .priority-box .p-label{font-size:11.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--danger);margin-bottom:6px;}
  .priority-box ol{margin:0;padding-left:18px;}
  .priority-box li{font-size:13px;color:#3a1f1c;line-height:1.5;margin-bottom:4px;}

  .footer-actions{display:flex;flex-direction:column;gap:10px;margin-top:24px;}
  .disclaimer{font-size:11.5px;color:var(--grey);text-align:center;margin-top:18px;line-height:1.5;}
  .section-label{color:var(--navy);font-size:15px;margin:24px 0 12px;font-weight:700;}

  @media (max-width:420px){ .hdr h1{font-size:18px;} .gauge-score{font-size:38px;} }
</style>
</head>
<body>
<div class="app" id="app"></div>

<style>
  #accessGate{position:fixed;inset:0;z-index:9999;background:linear-gradient(160deg,#021D4B 0%,#0C2C68 55%,#010D28 100%);display:flex;align-items:center;justify-content:center;padding:24px;}
  #accessGate .gate-card{max-width:380px;width:100%;background:rgba(255,255,255,0.03);border:1.5px solid rgba(239,206,88,0.35);border-radius:16px;padding:32px 26px;text-align:center;}
  #accessGate img{width:56px;height:56px;margin:0 auto 14px;}
  #accessGate h2{color:#fff;font-size:19px;margin:0 0 8px;font-family:Calibri,sans-serif;}
  #accessGate p{color:#B9C2DE;font-size:13.5px;line-height:1.6;margin:0 0 22px;}
  #accessGate input{width:100%;padding:13px 14px;border-radius:8px;border:1.5px solid rgba(255,255,255,0.25);background:rgba(255,255,255,0.06);color:#fff;font-size:15px;text-align:center;letter-spacing:2px;margin-bottom:14px;font-family:Calibri,sans-serif;box-sizing:border-box;}
  #accessGate input::placeholder{color:#7583AC;letter-spacing:normal;}
  #accessGate button{width:100%;padding:13px;border-radius:999px;border:none;background:#EFCE58;color:#021D4B;font-weight:800;font-size:14.5px;cursor:pointer;font-family:Calibri,sans-serif;}
  #accessGate .gate-error{color:#F3A6A6;font-size:12.5px;margin-top:12px;display:none;}
  #accessGate .gate-back{display:inline-block;margin-top:18px;color:#8B96BC;font-size:12px;text-decoration:none;}
</style>

<script>
let LOGO_B64;

/* ===================== DATA: 17 DEPARTMENTS x 12 QUESTIONS ===================== */
let DEPARTMENTS;

let SCALE_OPTIONS;

/* ===================== MATURITY TIER LOOKUP (SeamFlow Official Scoring Rubric) ===================== */
let MATURITY_TIERS;

function maturityTierFor(score){
  const s = Math.max(0, Math.min(100, Math.round(score)));
  return MATURITY_TIERS.find(t => s >= t.min && s <= t.max) || MATURITY_TIERS[0];
}

function stageColor(stage){
  if(stage === "Critical") return "#C0392B";
  if(stage === "Basic") return "#F5A800";
  if(stage === "Fairly Functional") return "#E2B93B";
  if(stage === "Structured") return "#4C8C4A";
  return "#1E8E5A"; // Excellent
}

/* ===================== SAVE & RESUME ===================== */
const SAVE_KEY = "seamflow_audit_progress_v1";

function saveProgress(){
  try{
    const payload = {
      facility: state.facility, role: state.role, mode: state.mode,
      selectedDepts: state.selectedDepts, qIndex: state.qIndex,
      answers: state.answers, savedAt: Date.now()
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(payload));
  }catch(e){ /* storage unavailable in this environment \u2014 fail silently */ }
}

function loadProgress(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return null;
    const parsed = JSON.parse(raw);
    if(!parsed || !parsed.selectedDepts || !parsed.selectedDepts.length) return null;
    return parsed;
  }catch(e){ return null; }
}

function clearProgress(){
  try{ localStorage.removeItem(SAVE_KEY); }catch(e){ /* ignore */ }
}

function timeAgo(ts){
  const mins = Math.round((Date.now()-ts)/60000);
  if(mins < 1) return "just now";
  if(mins < 60) return mins + " min ago";
  const hrs = Math.round(mins/60);
  if(hrs < 24) return hrs + " hr" + (hrs>1?"s":"") + " ago";
  const days = Math.round(hrs/24);
  return days + " day" + (days>1?"s":"") + " ago";
}

/* ===================== STATE ===================== */
let state = {
  screen:"intro", // intro | mode | picker | question | results
  facility:"", role:"",
  mode:"full", // full | focused
  selectedDepts: [],
  flat: [],
  qIndex: 0,
  answers: {},
  token: null,
  submitted: false
};

/* ===================== SUBMIT COMPLETED AUDIT ===================== */
// Sends the finished audit to /api/submit-audit so it can be looked up later
// (see admin.html) instead of only ever existing in this browser's state.
function submitAudit(){
  if(state.submitted || !state.token) return;
  state.submitted = true;
  const deptScores = state.selectedDepts.map(k=>{
    const d = DEPARTMENTS.find(x=>x.key===k);
    return { key:k, name:d.name, score:scoreDept(k) };
  });
  const overall = overallScore();
  const tier = maturityTierFor(overall);
  fetch("/api/submit-audit", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      token: state.token,
      facility: state.facility,
      role: state.role,
      selectedDepts: state.selectedDepts,
      answers: state.answers,
      deptScores, overall,
      tierLabel: tier.label,
      tierStage: tier.stage
    })
  }).catch(()=>{ /* best-effort — the visitor's own scorecard still rendered fine */ });
}

function buildFlatQuestions(){
  const list = [];
  DEPARTMENTS.filter(d => state.selectedDepts.includes(d.key)).forEach(d=>{
    d.questions.forEach((q, qi) => list.push({deptKey:d.key, deptName:d.name, qi, text:q}));
  });
  state.flat = list;
}

/* ===================== RENDER ===================== */
function render(){
  const app = document.getElementById("app");
  if(state.screen === "intro") app.innerHTML = renderIntro();
  else if(state.screen === "picker") app.innerHTML = renderPicker();
  else if(state.screen === "question") app.innerHTML = renderQuestion();
  else app.innerHTML = renderResults();
  attachHandlers();
}

function header(title, sub){
  return `
  <div class="hdr">
    <a href="../index.html" style="display:inline-block;font-size:11.5px;color:#B9C2DE;text-decoration:none;margin-bottom:10px;">&larr; seamflowconsulting.com</a>
    <img class="logo-img" src="data:image/png;base64,${LOGO_B64}" alt="SeamFlow Consulting \u2014 Clarity. Structure. Growth.">
    <h1>${title}</h1>
    <p>${sub}</p>
  </div>`;
}

function renderIntro(){
  const saved = loadProgress();
  const resumeBlock = saved ? `
    <div class="tier-card" style="margin-bottom:22px;">
      <div class="tier-eyebrow">Audit In Progress</div>
      <h3>${saved.facility || "Untitled facility"}</h3>
      <p>You were on question ${Math.min(saved.qIndex+1, saved.selectedDepts.length*12)} of ${saved.selectedDepts.length*12}. Saved ${timeAgo(saved.savedAt)}.</p>
      <div style="display:flex;gap:10px;margin-top:14px;">
        <button class="btn btn-primary" id="resumeBtn" style="flex:1;">Resume Audit</button>
        <button class="btn btn-ghost" id="discardBtn" style="flex:1;">Start New</button>
      </div>
    </div>` : "";

  return `
  ${header("Business Systems Audit", "The full SeamFlow diagnostic \u2014 every department, one consolidated scorecard.")}
  <div class="intro">
    <div class="plan-callout">
      <div class="tier-eyebrow">This Assessment Is Your</div>
      <h3>Clarity Plan \u2014 \u20a6150,000</h3>
      <p>This Business Systems Audit is SeamFlow's Clarity Plan in action \u2014 a full diagnostic across every department in your facility, producing the scorecard that shows exactly where structure is strong and where it's missing.</p>
    </div>
    ${resumeBlock}
    <h2>Before you start</h2>
    <p>This audit covers ${DEPARTMENTS.length} operational departments across your facility, with 12 standardized questions each. Answer based on how things actually run today, not how you'd like them to run.</p>
    <div class="field">
      <label>Facility name</label>
      <input type="text" id="facilityInput" placeholder="e.g. Grace Specialist Hospital">
    </div>
    <div class="field">
      <label>Your role</label>
      <select id="roleInput">
        <option value="">Select one</option>
        <option>Owner / Medical Director</option>
        <option>Facility Administrator</option>
        <option>Matron / Head of Nursing</option>
        <option>Operations Manager</option>
        <option>Other</option>
      </select>
    </div>
    <button class="btn btn-primary" id="continueBtn" style="width:100%;">Continue</button>
  </div>`;
}

function renderPicker(){
  return `
  ${header("Choose Your Audit Scope", "Full facility audit is recommended for the most accurate scorecard.")}
  <div class="intro">
    <div class="mode-card ${state.mode==='full'?'selected':''}" data-mode="full">
      <h4>Full Facility Audit \u2014 ${DEPARTMENTS.length} departments, ${DEPARTMENTS.length*12} questions</h4>
      <p>Covers every department end to end. Takes roughly 35\u201345 minutes. Produces the complete, most accurate consolidated scorecard.</p>
    </div>
    <div class="mode-card ${state.mode==='focused'?'selected':''}" data-mode="focused">
      <h4>Focused Audit \u2014 choose specific departments</h4>
      <p>Good for a quick check on known problem areas. Scorecard covers only what you select.</p>
    </div>

    <div id="deptPickerWrap" style="${state.mode==='focused'?'':'display:none;'} margin-top:8px;">
      <div class="dept-grid" id="deptGrid">
        ${DEPARTMENTS.map(d => `
          <label class="dept-check ${state.selectedDepts.includes(d.key)?'on':''}" data-key="${d.key}">
            <input type="checkbox" ${state.selectedDepts.includes(d.key)?'checked':''}>
            <span>${d.name}</span>
          </label>`).join("")}
      </div>
    </div>

    <button class="btn btn-primary" id="beginBtn" style="width:100%;margin-top:8px;">Begin Audit</button>
    <button class="btn btn-ghost" id="backToIntroBtn" style="width:100%;margin-top:10px;">Back</button>
  </div>`;
}

function renderQuestion(){
  const q = state.flat[state.qIndex];
  const total = state.flat.length;
  const pct = Math.round((state.qIndex/total)*100);
  const answeredKey = q.deptKey+"_"+q.qi;
  const selected = state.answers[answeredKey];
  const dept = DEPARTMENTS.find(d=>d.key===q.deptKey);
  const domainQNum = q.qi+1;

  return `
  ${header("Business Systems Audit", "")}
  <div class="progress-wrap">
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%;"></div></div>
    <div class="progress-label"><span>Question ${state.qIndex+1} of ${total}</span><span>${pct}% complete</span></div>
  </div>
  <div class="panel">
    <div class="domain-tag">${dept.name} \u2014 ${domainQNum}/12</div>
    <div class="question">
      <div class="q-text">${q.text}</div>
      <div class="scale">
        ${SCALE_OPTIONS.map(o => `
          <label class="opt ${selected===o.v?'selected':''}" data-val="${o.v}">
            <input type="radio" name="opt" value="${o.v}" ${selected===o.v?'checked':''}>
            <span class="dot"></span>
            <span class="opt-text">${o.t}</span>
          </label>`).join("")}
      </div>
    </div>
  </div>
  <div class="nav-row">
    <button class="btn btn-ghost" id="backBtn" ${state.qIndex===0?'disabled':''}>Back</button>
    <button class="btn btn-primary" id="nextBtn" ${selected?'':'disabled'}>${state.qIndex===total-1?'See Scorecard':'Next'}</button>
  </div>
  <div style="text-align:center;margin-top:16px;">
    <button id="saveExitBtn" style="background:none;border:none;color:var(--grey);font-size:12.5px;text-decoration:underline;cursor:pointer;font-family:inherit;padding:6px;">Save &amp; continue later</button>
  </div>`;
}

function scoreDept(deptKey){
  const dept = DEPARTMENTS.find(d=>d.key===deptKey);
  let total=0;
  dept.questions.forEach((q,qi)=>{ total += (state.answers[deptKey+"_"+qi] || 0); });
  return Math.round((total/(dept.questions.length*5))*100);
}

function overallScore(){
  const scores = state.selectedDepts.map(scoreDept);
  return Math.round(scores.reduce((a,b)=>a+b,0)/scores.length);
}

function structurePlanCopy(deptScores){
  const below70 = deptScores.filter(d => d.score < 70);
  if(below70.length === 0){
    return "Every department scored at or above the 70% operational maturity threshold on this assessment \u2014 a strong baseline. No department currently requires the Structure Plan; this facility is a candidate for the Growth Plan to sustain and build on what's already working.";
  }
  const names = below70.map(d => d.name);
  const list = names.length === 1
    ? names[0]
    : names.slice(0,-1).join(", ") + ", and " + names[names.length-1];
  return "The Structure Plan (processes and SOPs) should be adopted for every department whose operational maturity score is below 70%. Based on this assessment, that applies to "
    + below70.length + " of " + deptScores.length + " departments: " + list + ".";
}

function barColor(score){ if(score<40) return "#C0392B"; if(score<70) return "#F5A800"; return "#1E8E5A"; }

function renderResults(){
  const deptScores = state.selectedDepts.map(k=>{
    const d = DEPARTMENTS.find(x=>x.key===k);
    return {name:d.name, score:scoreDept(k)};
  }).sort((a,b)=>a.score-b.score);
  const overall = overallScore();
  const bottomThree = deptScores.slice(0,3);
  const tier = maturityTierFor(overall);
  const tierColor = stageColor(tier.stage);

  return `
  ${header("Your Business Systems Scorecard", (state.facility||"Your facility") + " \u2014 " + state.selectedDepts.length + " department" + (state.selectedDepts.length>1?"s":"") + " assessed")}
  <div class="results">
    <div class="gauge-wrap">
      <div class="gauge-score">${overall}<span>/100</span></div>
      <div class="gauge-label">Operational Maturity Score</div>
      <div class="maturity-badge" style="background:${tierColor}22;border:1.5px solid ${tierColor};color:${tierColor};">
        ${tier.label} <span style="opacity:0.7;font-weight:600;">\u00b7 ${tier.stage} tier \u00b7 SeamFlow Scoring Rubric</span>
      </div>
    </div>

    <div class="tier-card">
      <div class="tier-eyebrow">Recommended Next Step</div>
      <h3>Structure Plan \u2014 \u20a6250,000</h3>
      <p>${structurePlanCopy(deptScores)}</p>
    </div>

    <div class="priority-box">
      <div class="p-label">Top Priority Gaps</div>
      <ol>
        ${bottomThree.map(d=>`<li><strong>${d.name}</strong> \u2014 ${d.score}/100</li>`).join("")}
      </ol>
    </div>

    <div class="section-label">Department Breakdown</div>
    ${deptScores.map(d=>`
      <div class="domain-bar-row">
        <div class="domain-bar-head"><span>${d.name}</span><span class="pct">${d.score}%</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${d.score}%;background:${barColor(d.score)};"></div></div>
      </div>`).join("")}

    <div class="footer-actions">
      <button class="btn btn-primary" id="restartBtn">Take Another Audit</button>
    </div>
    <p class="disclaimer">This is a self-assessment diagnostic, not a formal SeamFlow audit. Contact SeamFlow Consulting to schedule a full Business Systems Assessment with a consultant.</p>
  </div>`;
}

/* ===================== HANDLERS ===================== */
function attachHandlers(){
  if(state.screen==="intro"){
    document.getElementById("continueBtn").onclick = () => {
      state.facility = document.getElementById("facilityInput").value.trim();
      state.role = document.getElementById("roleInput").value;
      state.screen = "picker";
      render(); window.scrollTo(0,0);
    };
    const resumeBtn = document.getElementById("resumeBtn");
    if(resumeBtn) resumeBtn.onclick = () => {
      const saved = loadProgress();
      if(!saved) return;
      state.facility = saved.facility;
      state.role = saved.role;
      state.mode = saved.mode;
      state.selectedDepts = saved.selectedDepts;
      buildFlatQuestions();
      state.qIndex = Math.min(saved.qIndex, state.flat.length-1);
      state.answers = saved.answers;
      state.screen = "question";
      render(); window.scrollTo(0,0);
    };
    const discardBtn = document.getElementById("discardBtn");
    if(discardBtn) discardBtn.onclick = () => {
      clearProgress();
      render(); window.scrollTo(0,0);
    };
  } else if(state.screen==="picker"){
    document.querySelectorAll(".mode-card").forEach(el=>{
      el.onclick = () => {
        state.mode = el.getAttribute("data-mode");
        if(state.mode==="full") state.selectedDepts = DEPARTMENTS.map(d=>d.key);
        render();
      };
    });
    document.querySelectorAll(".dept-check").forEach(el=>{
      el.onclick = (e) => {
        e.stopPropagation();
        const key = el.getAttribute("data-key");
        if(state.selectedDepts.includes(key)){
          state.selectedDepts = state.selectedDepts.filter(k=>k!==key);
        } else {
          state.selectedDepts.push(key);
        }
        render();
      };
    });
    const beginBtn = document.getElementById("beginBtn");
    if(beginBtn) beginBtn.onclick = () => {
      if(state.selectedDepts.length===0){ alert("Select at least one department."); return; }
      buildFlatQuestions();
      state.qIndex = 0;
      state.answers = {};
      state.screen = "question";
      render(); window.scrollTo(0,0);
    };
    const backBtn = document.getElementById("backToIntroBtn");
    if(backBtn) backBtn.onclick = () => { state.screen="intro"; render(); };
  } else if(state.screen==="question"){
    document.querySelectorAll(".opt").forEach(el=>{
      el.onclick = () => {
        const q = state.flat[state.qIndex];
        state.answers[q.deptKey+"_"+q.qi] = parseInt(el.getAttribute("data-val"),10);
        saveProgress();
        render();
      };
    });
    const backBtn = document.getElementById("backBtn");
    const nextBtn = document.getElementById("nextBtn");
    const saveExitBtn = document.getElementById("saveExitBtn");
    if(backBtn) backBtn.onclick = () => { if(state.qIndex>0){ state.qIndex--; saveProgress(); render(); window.scrollTo(0,0); } };
    if(nextBtn) nextBtn.onclick = () => {
      if(state.qIndex < state.flat.length-1){ state.qIndex++; saveProgress(); render(); window.scrollTo(0,0); }
      else { clearProgress(); state.screen="results"; submitAudit(); render(); window.scrollTo(0,0); }
    };
    if(saveExitBtn) saveExitBtn.onclick = () => {
      saveProgress();
      state.screen = "intro";
      render(); window.scrollTo(0,0);
    };
  } else if(state.screen==="results"){
    document.getElementById("restartBtn").onclick = () => {
      clearProgress();
      const token = state.token;
      state = {screen:"intro", facility:"", role:"", mode:"full", selectedDepts:DEPARTMENTS.map(d=>d.key), flat:[], qIndex:0, answers:{}, token, submitted:false};
      render(); window.scrollTo(0,0);
    };
  }
}

/* ===================== ACCESS BOOTSTRAP ===================== */
(async function(){
  const plan = "clarity";
  const params = new URLSearchParams(location.search);
  const token = params.get("token");
  const redirect = `../checkout.html?plan=${plan}&message=access-required`;
  if (!token || params.get("plan") !== plan) { location.replace(redirect); return; }
  try {
    const access = await fetch(`/api/check-access?token=${encodeURIComponent(token)}&plan=${plan}`);
    if (!access.ok || !(await access.json()).valid) { location.replace(redirect); return; }
    const contentResponse = await fetch(`/api/get-tool-content?token=${encodeURIComponent(token)}&plan=${plan}`);
    if (!contentResponse.ok) throw new Error("content unavailable");
    ({ LOGO_B64, DEPARTMENTS, SCALE_OPTIONS, MATURITY_TIERS } = await contentResponse.json());
    state.selectedDepts = DEPARTMENTS.map(d => d.key);
    state.token = token;
    render();
  } catch (error) {
    location.replace(redirect);
  }
})();
</script>
