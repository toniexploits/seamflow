<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SeamFlow Structure Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Calibri:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#021D4B;
    --navy-soft:#0C2C68;
    --gold:#EFCE58;
    --gold-light:#F8DE8A;
    --grey:#6B7280;
    --line:#E5E7EB;
    --bg:#FFFFFF;
    --panel:#F7F7F9;
    --green:#1E8E5A;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:Calibri,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:#1A1A1A;}
  .app{max-width:760px;margin:0 auto;padding:0 0 60px;}

  .hdr{background:linear-gradient(135deg,var(--navy) 0%, var(--navy-soft) 100%);color:#fff;padding:22px 20px 20px;border-bottom:4px solid var(--gold);}
  .brand-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .brand-row img{width:44px;height:44px;}
  .brand-name{font-family:'Alex Brush',cursive;font-size:30px;color:var(--gold);line-height:1;}
  .brand-sub{font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:var(--gold-light);margin-top:2px;}
  .hdr .tagline{font-size:11px;color:#B9C2DE;margin:2px 0 14px;font-style:italic;}
  .hdr h1{margin:0 0 4px;font-size:19px;font-weight:700;}
  .hdr p{margin:0;font-size:12.5px;color:#C9D0E8;line-height:1.5;}

  .plan-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(245,222,138,0.14);border:1px solid var(--gold);border-radius:999px;padding:6px 14px;margin-top:12px;}
  .plan-badge .amt{font-weight:700;color:var(--gold-light);font-size:13px;}

  .search-wrap{padding:16px 20px 0;position:sticky;top:0;background:var(--bg);z-index:5;}
  .search-input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;font-size:14px;font-family:inherit;}
  .search-results{margin-top:10px;}
  .search-hit{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;cursor:pointer;}
  .search-hit:hover{border-color:var(--gold);}
  .search-hit .sh-dept{font-size:10.5px;text-transform:uppercase;letter-spacing:0.5px;color:var(--grey);font-weight:700;}
  .search-hit .sh-title{font-size:14px;font-weight:700;color:var(--navy);margin-top:2px;}
  .search-empty{font-size:12.5px;color:var(--grey);padding:8px 2px;}

  .dept-nav{padding:16px 20px 4px;}
  .dept-nav-label{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--grey);margin-bottom:10px;}
  .dept-chip-grid{display:flex;flex-direction:column;gap:8px;}
  .dept-chip{display:flex;justify-content:space-between;align-items:center;border:1.5px solid var(--line);border-radius:10px;padding:13px 14px;cursor:pointer;}
  .dept-chip:hover{border-color:var(--gold);}
  .dept-chip .dc-name{font-size:14px;font-weight:700;color:var(--navy);}
  .dept-chip .dc-meta{font-size:11.5px;color:var(--grey);margin-top:2px;}
  .dept-chip .dc-arrow{color:var(--gold);font-size:18px;}

  .dept-view{padding:16px 20px 4px;}
  .back-link{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--navy);font-size:13px;font-weight:700;cursor:pointer;padding:6px 0;margin-bottom:10px;font-family:inherit;}
  .dept-title{font-size:20px;font-weight:700;color:var(--navy);margin:6px 0 8px;}
  .dept-overview{font-size:13.5px;color:#333;line-height:1.6;margin:0 0 20px;}

  .section-label{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--gold);border-bottom:2px solid var(--line);padding-bottom:8px;margin:22px 0 14px;}

  .workflow-strip{display:flex;flex-direction:column;gap:0;margin-bottom:6px;}
  .wf-step{display:flex;align-items:flex-start;gap:12px;position:relative;padding-bottom:18px;}
  .wf-step:last-child{padding-bottom:0;}
  .wf-num{width:26px;height:26px;min-width:26px;border-radius:50%;background:var(--navy);color:var(--gold-light);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;position:relative;z-index:1;}
  .wf-step:not(:last-child)::before{content:"";position:absolute;left:13px;top:26px;bottom:0;width:2px;background:var(--line);}
  .wf-text{font-size:13.5px;color:#222;padding-top:3px;line-height:1.4;}

  .sop-card{border:1.5px solid var(--line);border-radius:10px;margin-bottom:12px;overflow:hidden;}
  .sop-head{padding:14px 16px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--panel);}
  .sop-head .sh-code{font-size:10.5px;font-weight:700;color:var(--gold);letter-spacing:0.5px;}
  .sop-head .sh-title{font-size:14.5px;font-weight:700;color:var(--navy);margin-top:2px;}
  .sop-head .sh-toggle{font-size:16px;color:var(--grey);min-width:16px;text-align:center;}
  .sop-body{padding:0 16px 16px;display:none;}
  .sop-body.open{display:block;}
  .sop-field{margin-top:14px;}
  .sop-field .sf-label{font-size:10.5px;font-weight:700;letter-spacing:0.8px;text-transform:uppercase;color:var(--grey);margin-bottom:5px;}
  .sop-field .sf-val{font-size:13.5px;color:#222;line-height:1.55;}
  .sop-field-reg{background:#FFFBF0;border-left:3px solid var(--gold);padding:10px 12px;border-radius:4px;margin-top:14px;}
  .sop-field-reg .sf-label{color:var(--gold);}

  .reg-list{margin:0 0 6px;padding-left:20px;}
  .reg-list li{font-size:13px;color:#333;line-height:1.55;margin-bottom:8px;}
  .sop-steps{margin:0;padding-left:20px;}
  .sop-steps li{font-size:13.5px;color:#222;line-height:1.6;margin-bottom:6px;}
  .sop-meta-row{display:flex;gap:16px;margin-top:14px;flex-wrap:wrap;}
  .sop-meta-row .smr-item{font-size:12px;color:var(--grey);}
  .sop-meta-row .smr-item b{color:var(--navy);}

  .toc-link{font-size:12px;color:var(--grey);text-decoration:underline;cursor:pointer;background:none;border:none;font-family:inherit;padding:0;}

  .disclaimer{font-size:11.5px;color:var(--grey);text-align:center;margin:26px 20px 0;line-height:1.5;}

  @media (max-width:420px){ .brand-name{font-size:26px;} .dept-title{font-size:18px;} }
</style>
</head>
<body>
<div class="app" id="app"></div>

<style>
  #accessGate{position:fixed;inset:0;z-index:9999;background:linear-gradient(160deg,#021D4B 0%,#0C2C68 55%,#010D28 100%);display:flex;align-items:center;justify-content:center;padding:24px;}
  #accessGate .gate-card{max-width:380px;width:100%;background:rgba(255,255,255,0.03);border:1.5px solid rgba(239,206,88,0.35);border-radius:16px;padding:32px 26px;text-align:center;}
  #accessGate img{width:56px;height:56px;margin:0 auto 14px;}
  #accessGate h2{color:#fff;font-size:19px;margin:0 0 8px;font-family:Calibri,sans-serif;}
  #accessGate p{color:#B9C2DE;font-size:13.5px;line-height:1.6;margin:0 0 22px;}
  #accessGate input{width:100%;padding:13px 14px;border-radius:8px;border:1.5px solid rgba(255,255,255,0.25);background:rgba(255,255,255,0.06);color:#fff;font-size:15px;text-align:center;letter-spacing:2px;margin-bottom:14px;font-family:Calibri,sans-serif;box-sizing:border-box;}
  #accessGate input::placeholder{color:#7583AC;letter-spacing:normal;}
  #accessGate button{width:100%;padding:13px;border-radius:999px;border:none;background:#EFCE58;color:#021D4B;font-weight:800;font-size:14.5px;cursor:pointer;font-family:Calibri,sans-serif;}
  #accessGate .gate-error{color:#F3A6A6;font-size:12.5px;margin-top:12px;display:none;}
  #accessGate .gate-back{display:inline-block;margin-top:18px;color:#8B96BC;font-size:12px;text-decoration:none;}
</style>

<script>
let ICON_B64;
let DEPARTMENTS;
let TOKEN;

let state = { screen:"home", deptKey:null, query:"" };

/* ===================== USAGE TRACKING ===================== */
// This tool has no questionnaire to submit (unlike the Clarity Plan) —
// this just records that the access was used and what was looked at, so
// admin.html has some visibility into it. Fire-and-forget.
function logUsage(type, label){
  if(!TOKEN) return;
  fetch("/api/log-usage", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ token: TOKEN, plan:"structure", type, label: label || "" })
  }).catch(()=>{});
}

function render(){
  const app = document.getElementById("app");
  if(state.screen === "home") app.innerHTML = renderHome();
  else app.innerHTML = renderDept();
  attachHandlers();
  window.scrollTo(0,0);
}

function brandHeader(){
  return `
  <div class="hdr">
    <div class="brand-row">
      <img src="data:image/png;base64,${ICON_B64}" alt="SeamFlow icon">
      <div>
        <div class="brand-name">SeamFlow</div>
        <div class="brand-sub">Consulting</div>
      </div>
    </div>
    <div class="tagline">Clarity. Structure. Growth.</div>
    <h1>Structure Plan \u2014 Processes, SOPs &amp; Workflows</h1>
    <p>Every department in your facility, fully documented and ready to implement.</p>
    <div class="plan-badge">
      <span style="color:#fff;font-size:12px;">You are viewing the</span>
      <span class="amt">Structure Plan</span>
    </div>
  </div>`;
}

function totalSopCount(){
  return DEPARTMENTS.reduce((a,d)=>a+d.sops.length,0);
}

function renderHome(){
  const q = state.query.trim().toLowerCase();
  let searchBlock = "";
  if(q.length > 0){
    const hits = [];
    DEPARTMENTS.forEach(d => {
      d.sops.forEach(s => {
        const hay = (s.title + " " + s.purpose + " " + s.code + " " + s.regulatory).toLowerCase();
        if(hay.includes(q)) hits.push({dept:d, sop:s});
      });
    });
    searchBlock = `
    <div class="search-results">
      ${hits.length === 0 ? `<div class="search-empty">No process or SOP matches "${state.query}".</div>` :
        hits.map(h => `
        <div class="search-hit" data-dept="${h.dept.key}" data-sop="${h.sop.code}">
          <div class="sh-dept">${h.dept.name}</div>
          <div class="sh-title">${h.sop.code} \u2014 ${h.sop.title}</div>
        </div>`).join("")}
    </div>`;
  }

  return `
  ${brandHeader()}
  <div class="search-wrap">
    <input type="text" class="search-input" id="searchInput" placeholder="Search any process or SOP, e.g. 'medication', 'triage', 'claims'" value="${state.query}">
    ${searchBlock}
  </div>
  <div class="dept-nav">
    <div class="dept-nav-label">All ${DEPARTMENTS.length} Departments \u2014 ${totalSopCount()} Documented Processes</div>
    <div class="dept-chip-grid">
      ${DEPARTMENTS.map(d => `
        <div class="dept-chip" data-dept="${d.key}">
          <div>
            <div class="dc-name">${d.name}</div>
            <div class="dc-meta">${d.sops.length} Processes \u00b7 1 workflow</div>
          </div>
          <div class="dc-arrow">\u203a</div>
        </div>`).join("")}
    </div>
  </div>
  <p class="disclaimer">This Structure Plan package documents processes, SOPs, and workflows for every core department. Content should be adapted to reflect your facility's specific licensing, staffing, and regulatory context before formal rollout.</p>
  `;
}

function renderDept(openSopCode){
  const d = DEPARTMENTS.find(x => x.key === state.deptKey);
  return `
  ${brandHeader()}
  <div class="dept-view">
    <button class="back-link" id="backBtn">\u2039 All departments</button>
    <div class="dept-title">${d.name}</div>
    <div class="dept-overview">${d.overview}</div>

    <div class="section-label">Governing Regulatory Bodies</div>
    <ul class="reg-list">
      ${d.regulatory_bodies.map(rb => `<li>${rb}</li>`).join("")}
    </ul>

    <div class="section-label">Core Workflow</div>
    <div class="workflow-strip">
      ${d.workflow.map((w,i) => `
        <div class="wf-step">
          <div class="wf-num">${i+1}</div>
          <div class="wf-text">${w}</div>
        </div>`).join("")}
    </div>

    <div class="section-label">Standard Operating Procedures</div>
    ${d.sops.map(s => `
      <div class="sop-card" data-sop="${s.code}">
        <div class="sop-head">
          <div>
            <div class="sh-code">${s.code}</div>
            <div class="sh-title">${s.title}</div>
          </div>
          <div class="sh-toggle">${state._openSop === s.code ? "\u2212" : "+"}</div>
        </div>
        <div class="sop-body ${state._openSop === s.code ? "open" : ""}">
          <div class="sop-field"><div class="sf-label">Purpose</div><div class="sf-val">${s.purpose}</div></div>
          <div class="sop-field"><div class="sf-label">Scope</div><div class="sf-val">${s.scope}</div></div>
          <div class="sop-field sop-field-reg"><div class="sf-label">Regulatory Alignment</div><div class="sf-val">${s.regulatory}</div></div>
          <div class="sop-field"><div class="sf-label">Procedure</div>
            <ol class="sop-steps">${s.steps.map(st => `<li>${st}</li>`).join("")}</ol>
          </div>
          <div class="sop-meta-row">
            <div class="smr-item"><b>Responsible:</b> ${s.responsible}</div>
            <div class="smr-item"><b>Frequency:</b> ${s.frequency}</div>
            <div class="smr-item"><b>Records:</b> ${s.records}</div>
          </div>
        </div>
      </div>`).join("")}
  </div>
  <p class="disclaimer">Structure Plan \u2014 SeamFlow Consulting. This SOP set should be reviewed against your facility's specific license class and regulatory requirements before adoption.</p>
  `;
}

function attachHandlers(){
  if(state.screen === "home"){
    const searchInput = document.getElementById("searchInput");
    searchInput.oninput = (e) => { state.query = e.target.value; render(); document.getElementById("searchInput").focus(); document.getElementById("searchInput").setSelectionRange(state.query.length, state.query.length); };
    document.querySelectorAll(".dept-chip").forEach(el => {
      el.onclick = () => {
        state.screen = "dept"; state.deptKey = el.getAttribute("data-dept"); state._openSop = null;
        const d = DEPARTMENTS.find(x => x.key === state.deptKey);
        logUsage("view", d.name);
        render();
      };
    });
    document.querySelectorAll(".search-hit").forEach(el => {
      el.onclick = () => {
        state.screen = "dept";
        state.deptKey = el.getAttribute("data-dept");
        state._openSop = el.getAttribute("data-sop");
        state.query = "";
        const d = DEPARTMENTS.find(x => x.key === state.deptKey);
        const s = d.sops.find(x => x.code === state._openSop);
        logUsage("view", `${d.name} — ${s.code}: ${s.title}`);
        render();
      };
    });
  } else {
    document.getElementById("backBtn").onclick = () => { state.screen = "home"; state.deptKey = null; render(); };
    document.querySelectorAll(".sop-head").forEach(el => {
      el.onclick = () => {
        const card = el.parentElement;
        const code = card.getAttribute("data-sop");
        const opening = state._openSop !== code;
        state._openSop = opening ? code : null;
        if(opening){
          const d = DEPARTMENTS.find(x => x.key === state.deptKey);
          const s = d.sops.find(x => x.code === code);
          logUsage("view", `${d.name} — ${s.code}: ${s.title}`);
        }
        render();
      };
    });
  }
}

/* ===================== ACCESS BOOTSTRAP ===================== */
(async function(){
  const plan = "structure";
  const params = new URLSearchParams(location.search);
  const token = params.get("token");
  const redirect = `../contact.html?interest=${plan}`;
  if (!token || params.get("plan") !== plan) { location.replace(redirect); return; }
  try {
    const access = await fetch(`/api/check-access?token=${encodeURIComponent(token)}&plan=${plan}`);
    if (!access.ok || !(await access.json()).valid) { location.replace(redirect); return; }
    const contentResponse = await fetch(`/api/get-tool-content?token=${encodeURIComponent(token)}&plan=${plan}`);
    if (!contentResponse.ok) throw new Error("content unavailable");
    ({ ICON_B64, DEPARTMENTS } = await contentResponse.json());
    TOKEN = token;
    logUsage("access");
    render();
  } catch (error) {
    location.replace(redirect);
  }
})();
</script>
</body>
</html>
