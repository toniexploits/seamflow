<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SeamFlow Growth Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Calibri:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#021D4B;
    --navy-soft:#0C2C68;
    --gold:#EFCE58;
    --gold-light:#F8DE8A;
    --grey:#6B7280;
    --line:#E5E7EB;
    --bg:#FFFFFF;
    --panel:#F7F7F9;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:Calibri,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:#1A1A1A;}
  .app{max-width:760px;margin:0 auto;padding:0 0 60px;}

  .hdr{background:linear-gradient(135deg,var(--navy) 0%, var(--navy-soft) 100%);color:#fff;padding:22px 20px 20px;border-bottom:4px solid var(--gold);}
  .brand-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .brand-row img{width:44px;height:44px;}
  .brand-name{font-family:'Alex Brush',cursive;font-size:30px;color:var(--gold);line-height:1;}
  .brand-sub{font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:var(--gold-light);margin-top:2px;}
  .hdr .tagline{font-size:11px;color:#B9C2DE;margin:2px 0 14px;font-style:italic;}
  .hdr h1{margin:0 0 4px;font-size:19px;font-weight:700;}
  .hdr p{margin:0;font-size:12.5px;color:#C9D0E8;line-height:1.5;}
  .plan-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(245,222,138,0.14);border:1px solid var(--gold);border-radius:999px;padding:6px 14px;margin-top:12px;}
  .plan-badge .amt{font-weight:700;color:var(--gold-light);font-size:13px;}

  .intro{padding:20px 20px 4px;}
  .intro p{font-size:13.5px;color:#333;line-height:1.6;margin:0 0 16px;}

  .section-nav{padding:4px 20px 4px;}
  .section-card{
    display:flex;gap:14px;align-items:flex-start;
    border:1.5px solid var(--line);border-radius:12px;
    padding:16px 16px;margin-bottom:12px;cursor:pointer;
  }
  .section-card:hover{border-color:var(--gold);}
  .section-letter{
    width:38px;height:38px;min-width:38px;border-radius:10px;
    background:var(--navy);color:var(--gold-light);
    display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:16px;
  }
  .section-card .sc-title{font-size:15px;font-weight:700;color:var(--navy);margin-bottom:3px;}
  .section-card .sc-sub{font-size:12px;color:var(--grey);line-height:1.4;}
  .section-card .sc-arrow{margin-left:auto;color:var(--gold);font-size:18px;align-self:center;}

  .detail-view{padding:18px 20px 4px;}
  .back-link{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--navy);font-size:13px;font-weight:700;cursor:pointer;padding:6px 0;margin-bottom:10px;font-family:inherit;}
  .detail-eyebrow{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);margin-bottom:6px;}
  .detail-title{font-size:21px;font-weight:700;color:var(--navy);margin:0 0 6px;line-height:1.25;}
  .detail-sub{font-size:13px;color:var(--grey);margin:0 0 20px;line-height:1.5;font-style:italic;}

  .block-h2{font-size:16.5px;font-weight:700;color:var(--navy);margin:22px 0 10px;border-bottom:2px solid var(--line);padding-bottom:6px;}
  .block-h3{font-size:14.5px;font-weight:700;color:var(--gold);margin:16px 0 6px;}
  .block-p{font-size:13.5px;color:#222;line-height:1.65;margin:0 0 12px;}
  .block-quote{border-left:4px solid var(--gold);background:#FFFBF0;padding:10px 14px;margin:12px 0;font-size:13.5px;font-style:italic;color:var(--navy);line-height:1.55;border-radius:4px;}
  .block-list{margin:0 0 14px;padding-left:20px;}
  .block-list li{font-size:13.5px;color:#222;line-height:1.6;margin-bottom:8px;}
  .block-list li b{color:var(--navy);}

  .dept-grid{display:flex;flex-direction:column;gap:8px;margin-top:6px;}
  .dept-chip{display:flex;justify-content:space-between;align-items:center;border:1.5px solid var(--line);border-radius:10px;padding:13px 14px;cursor:pointer;}
  .dept-chip:hover{border-color:var(--gold);}
  .dept-chip .dc-name{font-size:14px;font-weight:700;color:var(--navy);}
  .dept-chip .dc-meta{font-size:11.5px;color:var(--grey);margin-top:2px;}
  .dept-chip .dc-arrow{color:var(--gold);font-size:18px;}

  .kpi-grid{display:flex;flex-direction:column;gap:12px;margin:14px 0 18px;}
  .kpi-card{border:1.5px solid var(--line);border-radius:10px;background:var(--panel);padding:14px 16px;}
  .kpi-card .kc-badge{font-size:10.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--gold);margin-bottom:4px;}
  .kpi-card .kc-value{font-size:26px;font-weight:800;color:var(--navy);line-height:1.1;margin-bottom:4px;}
  .kpi-card .kc-name{font-size:14px;font-weight:700;color:var(--navy);margin-bottom:4px;}
  .kpi-card .kc-def{font-size:12px;color:#444;font-style:italic;line-height:1.4;margin-bottom:10px;}
  .kpi-card .kc-meta{display:flex;gap:14px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:8px;}
  .kpi-card .kc-meta span{font-size:11px;color:var(--grey);}
  .kpi-card .kc-meta b{color:#333;font-weight:700;text-transform:uppercase;font-size:10px;letter-spacing:0.3px;}
  .type-tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--navy);background:#EFF1F8;border:1px solid var(--line);padding:4px 10px;border-radius:999px;margin-bottom:10px;}
  .status-legend{border:1.5px solid var(--gold);border-radius:10px;padding:14px 16px;margin:14px 0 20px;background:#FFFBF0;}
  .status-legend .sl-item{font-size:12.5px;color:#333;line-height:1.5;margin-bottom:6px;}
  .status-legend .sl-item b{color:var(--navy);}

  .disclaimer{font-size:11.5px;color:var(--grey);text-align:center;margin:26px 20px 0;line-height:1.5;}

  @media (max-width:420px){ .brand-name{font-size:26px;} .detail-title{font-size:19px;} }
</style>
</head>
<body>
<div class="app" id="app"></div>

<style>
  #accessGate{position:fixed;inset:0;z-index:9999;background:linear-gradient(160deg,#021D4B 0%,#0C2C68 55%,#010D28 100%);display:flex;align-items:center;justify-content:center;padding:24px;}
  #accessGate .gate-card{max-width:380px;width:100%;background:rgba(255,255,255,0.03);border:1.5px solid rgba(239,206,88,0.35);border-radius:16px;padding:32px 26px;text-align:center;}
  #accessGate img{width:56px;height:56px;margin:0 auto 14px;}
  #accessGate h2{color:#fff;font-size:19px;margin:0 0 8px;font-family:Calibri,sans-serif;}
  #accessGate p{color:#B9C2DE;font-size:13.5px;line-height:1.6;margin:0 0 22px;}
  #accessGate input{width:100%;padding:13px 14px;border-radius:8px;border:1.5px solid rgba(255,255,255,0.25);background:rgba(255,255,255,0.06);color:#fff;font-size:15px;text-align:center;letter-spacing:2px;margin-bottom:14px;font-family:Calibri,sans-serif;box-sizing:border-box;}
  #accessGate input::placeholder{color:#7583AC;letter-spacing:normal;}
  #accessGate button{width:100%;padding:13px;border-radius:999px;border:none;background:#EFCE58;color:#021D4B;font-weight:800;font-size:14.5px;cursor:pointer;font-family:Calibri,sans-serif;}
  #accessGate .gate-error{color:#F3A6A6;font-size:12.5px;margin-top:12px;display:none;}
  #accessGate .gate-back{display:inline-block;margin-top:18px;color:#8B96BC;font-size:12px;text-decoration:none;}
</style>

<script>
let ICON_B64;
let SECTIONS;

let state = { screen:"home", sectionKey:null, deptIndex:null };

function render(){
  const app = document.getElementById("app");
  if(state.screen === "home") app.innerHTML = renderHome();
  else if(state.screen === "section") app.innerHTML = renderSection();
  else app.innerHTML = renderDept();
  attachHandlers();
  window.scrollTo(0,0);
}

function brandHeader(){
  return `
  <div class="hdr">
    <a href="../index.html" style="display:inline-block;font-size:11.5px;color:#B9C2DE;text-decoration:none;margin-bottom:10px;">&larr; seamflowconsulting.com</a>
    <div class="brand-row">
      <img src="data:image/png;base64,${ICON_B64}" alt="SeamFlow icon">
      <div>
        <div class="brand-name">SeamFlow</div>
        <div class="brand-sub">Consulting</div>
      </div>
    </div>
    <div class="tagline">Clarity. Structure. Growth.</div>
    <h1>The Growth Plan</h1>
    <p>Brand Trust \u00b7 Preventive Healthcare \u00b7 Performance \u00b7 People \u00b7 Expansion</p>
    <div class="plan-badge">
      <span style="color:#fff;font-size:12px;">You are viewing the</span>
      <span class="amt">Growth Plan \u2014 \u20a6350,000</span>
    </div>
  </div>`;
}

function renderHome(){
  return `
  ${brandHeader()}
  <div class="intro">
    <p>The Growth Plan is the third and final stage of the SeamFlow Operating System \u2014 what keeps a structured facility improving, trusted, well-staffed, and ready to expand. Tap any section below.</p>
  </div>
  <div class="section-nav">
    ${SECTIONS.map(s => `
      <div class="section-card" data-key="${s.key}">
        <div class="section-letter">${s.letter}</div>
        <div>
          <div class="sc-title">${s.title}</div>
          <div class="sc-sub">${s.subtitle}</div>
        </div>
        <div class="sc-arrow">\u203a</div>
      </div>`).join("")}
  </div>
  <p class="disclaimer">This Growth Plan should be adapted to your facility's specific size, specialty, licensing conditions, and local market, and reviewed periodically as your facility and Nigerian healthcare regulation evolve.</p>
  `;
}

function renderBlock(b){
  if(b.t === "h2") return `<div class="block-h2">${b.text}</div>`;
  if(b.t === "h3") return `<div class="block-h3">${b.text}</div>`;
  if(b.t === "p") return `<p class="block-p">${b.text}</p>`;
  if(b.t === "quote") return `<div class="block-quote">${b.text}</div>`;
  if(b.t === "bullets") return `<ul class="block-list">${b.items.map(i => `<li>${i.lead ? `<b>${i.lead}</b> ` : ""}${i.text}</li>`).join("")}</ul>`;
  if(b.t === "numbered") return `<ol class="block-list">${b.items.map(i => `<li>${i.lead ? `<b>${i.lead}</b> ` : ""}${i.text}</li>`).join("")}</ol>`;
  return "";
}

function renderSection(){
  const s = SECTIONS.find(x => x.key === state.sectionKey);
  let content = "";
  if(s.key === "kpi_dashboards"){
    content = `
      ${s.intro_blocks.map(renderBlock).join("")}
      <div class="dept-grid">
        ${s.departments.map((d,i) => `
          <div class="dept-chip" data-dept="${i}">
            <div>
              <div class="dc-name">${i+1}. ${d.name}</div>
              <div class="dc-meta">${d.type} \u00b7 5 KPIs</div>
            </div>
            <div class="dc-arrow">\u203a</div>
          </div>`).join("")}
      </div>
    `;
  } else {
    content = s.blocks.map(renderBlock).join("");
  }
  return `
  ${brandHeader()}
  <div class="detail-view">
    <button class="back-link" id="backBtn">\u2039 All sections</button>
    <div class="detail-eyebrow">Section ${s.letter}</div>
    <div class="detail-title">${s.title}</div>
    <div class="detail-sub">${s.subtitle}</div>
    ${content}
  </div>
  <p class="disclaimer">Growth Plan \u2014 SeamFlow Consulting.</p>
  `;
}

function renderDept(){
  const s = SECTIONS.find(x => x.key === "kpi_dashboards");
  const d = s.departments[state.deptIndex];
  return `
  ${brandHeader()}
  <div class="detail-view">
    <button class="back-link" id="backToSectionBtn">\u2039 All departments</button>
    <div class="detail-eyebrow">Section C \u2014 KPI Dashboards</div>
    <div class="detail-title">${d.name}</div>
    <div class="type-tag">${d.type}</div>
    <p class="block-p">${d.overview}</p>
    <div class="kpi-grid">
      ${d.kpis.map(k => `
        <div class="kpi-card">
          <div class="kc-badge">Target Benchmark</div>
          <div class="kc-value">${k[2]}</div>
          <div class="kc-name">${k[0]}</div>
          <div class="kc-def">${k[1]}</div>
          <div class="kc-meta">
            <span><b>Frequency</b> ${k[3]}</span>
            <span><b>Owner</b> ${k[4]}</span>
          </div>
        </div>`).join("")}
    </div>
  </div>
  <p class="disclaimer">Growth Plan \u2014 SeamFlow Consulting. Targets are starting points \u2014 adjust as your facility's own baseline data accumulates.</p>
  `;
}

function attachHandlers(){
  if(state.screen === "home"){
    document.querySelectorAll(".section-card").forEach(el => {
      el.onclick = () => { state.screen = "section"; state.sectionKey = el.getAttribute("data-key"); render(); };
    });
  } else if(state.screen === "section"){
    document.getElementById("backBtn").onclick = () => { state.screen = "home"; state.sectionKey = null; render(); };
    document.querySelectorAll(".dept-chip").forEach(el => {
      el.onclick = () => { state.screen = "dept"; state.deptIndex = parseInt(el.getAttribute("data-dept"),10); render(); };
    });
  } else {
    document.getElementById("backToSectionBtn").onclick = () => { state.screen = "section"; render(); };
  }
}

/* ===================== ACCESS BOOTSTRAP ===================== */
(async function(){
  const plan = "growth";
  const params = new URLSearchParams(location.search);
  const token = params.get("token");
  const redirect = `../checkout.html?plan=${plan}&message=access-required`;
  if (!token || params.get("plan") !== plan) { location.replace(redirect); return; }
  try {
    const access = await fetch(`/api/check-access?token=${encodeURIComponent(token)}&plan=${plan}`);
    if (!access.ok || !(await access.json()).valid) { location.replace(redirect); return; }
    const contentResponse = await fetch(`/api/get-tool-content?token=${encodeURIComponent(token)}&plan=${plan}`);
    if (!contentResponse.ok) throw new Error("content unavailable");
    ({ ICON_B64, SECTIONS } = await contentResponse.json());
    render();
  } catch (error) {
    location.replace(redirect);
  }
})();
</script>
</body>
</html>
