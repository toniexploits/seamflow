<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SeamFlow Growth Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Calibri:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#021D4B;
    --navy-soft:#0C2C68;
    --gold:#EFCE58;
    --gold-light:#F8DE8A;
    --grey:#6B7280;
    --line:#E5E7EB;
    --bg:#FFFFFF;
    --panel:#F7F7F9;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:Calibri,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:#1A1A1A;}
  .app{max-width:760px;margin:0 auto;padding:0 0 60px;}

  .hdr{background:linear-gradient(135deg,var(--navy) 0%, var(--navy-soft) 100%);color:#fff;padding:22px 20px 20px;border-bottom:4px solid var(--gold);}
  .brand-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .brand-row img{width:44px;height:44px;}
  .brand-name{font-family:'Alex Brush',cursive;font-size:30px;color:var(--gold);line-height:1;}
  .brand-sub{font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:var(--gold-light);margin-top:2px;}
  .hdr .tagline{font-size:11px;color:#B9C2DE;margin:2px 0 14px;font-style:italic;}
  .hdr h1{margin:0 0 4px;font-size:19px;font-weight:700;}
  .hdr p{margin:0;font-size:12.5px;color:#C9D0E8;line-height:1.5;}
  .plan-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(245,222,138,0.14);border:1px solid var(--gold);border-radius:999px;padding:6px 14px;margin-top:12px;}
  .plan-badge .amt{font-weight:700;color:var(--gold-light);font-size:13px;}

  .intro{padding:20px 20px 4px;}
  .intro p{font-size:13.5px;color:#333;line-height:1.6;margin:0 0 16px;}

  .section-nav{padding:4px 20px 4px;}
  .section-card{
    display:flex;gap:14px;align-items:flex-start;
    border:1.5px solid var(--line);border-radius:12px;
    padding:16px 16px;margin-bottom:12px;cursor:pointer;
  }
  .section-card:hover{border-color:var(--gold);}
  .section-letter{
    width:38px;height:38px;min-width:38px;border-radius:10px;
    background:var(--navy);color:var(--gold-light);
    display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:16px;
  }
  .section-card .sc-title{font-size:15px;font-weight:700;color:var(--navy);margin-bottom:3px;}
  .section-card .sc-sub{font-size:12px;color:var(--grey);line-height:1.4;}
  .section-card .sc-arrow{margin-left:auto;color:var(--gold);font-size:18px;align-self:center;}

  .detail-view{padding:18px 20px 4px;}
  .back-link{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--navy);font-size:13px;font-weight:700;cursor:pointer;padding:6px 0;margin-bottom:10px;font-family:inherit;}
  .detail-eyebrow{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);margin-bottom:6px;}
  .detail-title{font-size:21px;font-weight:700;color:var(--navy);margin:0 0 6px;line-height:1.25;}
  .detail-sub{font-size:13px;color:var(--grey);margin:0 0 20px;line-height:1.5;font-style:italic;}

  .block-h2{font-size:16.5px;font-weight:700;color:var(--navy);margin:22px 0 10px;border-bottom:2px solid var(--line);padding-bottom:6px;}
  .block-h3{font-size:14.5px;font-weight:700;color:var(--gold);margin:16px 0 6px;}
  .block-p{font-size:13.5px;color:#222;line-height:1.65;margin:0 0 12px;}
  .block-quote{border-left:4px solid var(--gold);background:#FFFBF0;padding:10px 14px;margin:12px 0;font-size:13.5px;font-style:italic;color:var(--navy);line-height:1.55;border-radius:4px;}
  .block-list{margin:0 0 14px;padding-left:20px;}
  .block-list li{font-size:13.5px;color:#222;line-height:1.6;margin-bottom:8px;}
  .block-list li b{color:var(--navy);}

  .dept-grid{display:flex;flex-direction:column;gap:8px;margin-top:6px;}
  .dept-chip{display:flex;justify-content:space-between;align-items:center;border:1.5px solid var(--line);border-radius:10px;padding:13px 14px;cursor:pointer;}
  .dept-chip:hover{border-color:var(--gold);}
  .dept-chip .dc-name{font-size:14px;font-weight:700;color:var(--navy);}
  .dept-chip .dc-meta{font-size:11.5px;color:var(--grey);margin-top:2px;}
  .dept-chip .dc-arrow{color:var(--gold);font-size:18px;}

  .kpi-grid{display:flex;flex-direction:column;gap:12px;margin:14px 0 18px;}
  .kpi-card{border:1.5px solid var(--line);border-radius:10px;background:var(--panel);padding:14px 16px;}
  .kpi-card .kc-badge{font-size:10.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--gold);margin-bottom:4px;}
  .kpi-card .kc-value{font-size:26px;font-weight:800;color:var(--navy);line-height:1.1;margin-bottom:4px;}
  .kpi-card .kc-name{font-size:14px;font-weight:700;color:var(--navy);margin-bottom:4px;}
  .kpi-card .kc-def{font-size:12px;color:#444;font-style:italic;line-height:1.4;margin-bottom:10px;}
  .kpi-card .kc-meta{display:flex;gap:14px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:8px;}
  .kpi-card .kc-meta span{font-size:11px;color:var(--grey);}
  .kpi-card .kc-meta b{color:#333;font-weight:700;text-transform:uppercase;font-size:10px;letter-spacing:0.3px;}
  .type-tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--navy);background:#EFF1F8;border:1px solid var(--line);padding:4px 10px;border-radius:999px;margin-bottom:10px;}
  .status-legend{border:1.5px solid var(--gold);border-radius:10px;padding:14px 16px;margin:14px 0 20px;background:#FFFBF0;}
  .status-legend .sl-item{font-size:12.5px;color:#333;line-height:1.5;margin-bottom:6px;}
  .status-legend .sl-item b{color:var(--navy);}

  .disclaimer{font-size:11.5px;color:var(--grey);text-align:center;margin:26px 20px 0;line-height:1.5;}

  @media (max-width:420px){ .brand-name{font-size:26px;} .detail-title{font-size:19px;} }
</style>
</head>
<body>
<div class="app" id="app"></div>

<style>
  #accessGate{position:fixed;inset:0;z-index:9999;background:linear-gradient(160deg,#021D4B 0%,#0C2C68 55%,#010D28 100%);display:flex;align-items:center;justify-content:center;padding:24px;}
  #accessGate .gate-card{max-width:380px;width:100%;background:rgba(255,255,255,0.03);border:1.5px solid rgba(239,206,88,0.35);border-radius:16px;padding:32px 26px;text-align:center;}
  #accessGate img{width:56px;height:56px;margin:0 auto 14px;}
  #accessGate h2{color:#fff;font-size:19px;margin:0 0 8px;font-family:Calibri,sans-serif;}
  #accessGate p{color:#B9C2DE;font-size:13.5px;line-height:1.6;margin:0 0 22px;}
  #accessGate input{width:100%;padding:13px 14px;border-radius:8px;border:1.5px solid rgba(255,255,255,0.25);background:rgba(255,255,255,0.06);color:#fff;font-size:15px;text-align:center;letter-spacing:2px;margin-bottom:14px;font-family:Calibri,sans-serif;box-sizing:border-box;}
  #accessGate input::placeholder{color:#7583AC;letter-spacing:normal;}
  #accessGate button{width:100%;padding:13px;border-radius:999px;border:none;background:#EFCE58;color:#021D4B;font-weight:800;font-size:14.5px;cursor:pointer;font-family:Calibri,sans-serif;}
  #accessGate .gate-error{color:#F3A6A6;font-size:12.5px;margin-top:12px;display:none;}
  #accessGate .gate-back{display:inline-block;margin-top:18px;color:#8B96BC;font-size:12px;text-decoration:none;}
</style>

<div id="accessGate">
  <div class="gate-card">
    <img src="../assets/icon.png" alt="SeamFlow">
    <h2>Growth Plan &mdash; Access Required</h2>
    <p>This tool is available to clients who have purchased the Growth Plan. Enter your access code below. If you don't have one yet, reach out and we'll send it once payment is confirmed.</p>
    <input type="password" id="gatePassword" placeholder="Access code" autocomplete="off">
    <button id="gateSubmit">Unlock</button>
    <div class="gate-error" id="gateError">That code isn't right. Please check and try again.</div>
    <a href="../contact.html" class="gate-back">&larr; Don't have a code? Contact us</a>
  </div>
</div>

const SECTIONS = [{"key": "brand_trust", "letter": "A", "title": "Building a Trusted Healthcare Brand", "subtitle": "How Nigerian healthcare SMEs earn patient loyalty that survives competition, price pressure, and word-of-mouth", "blocks": [{"t": "h2", "text": "A.1 Why Trust Is the Real Currency"}, {"t": "p", "text": "In most industries, a brand competes on price or convenience. In healthcare, it competes on something far more personal: whether a stranger will trust you with their body, their child, or their parent at the most frightened moment of their life. In Nigeria, that trust is in short supply. Patients have grown used to long waits with no explanation, informal charges that vary by who is asking, and diagnoses that feel like guesses. Many default to \u201cbig name\u201d teaching hospitals, religious healing centres, or travelling abroad \u2014 not because your facility lacks competent doctors, but because nothing has shown them, consistently, that they can trust you."}, {"t": "quote", "text": "A healthcare SME does not need to be the biggest facility in its city to be the most trusted one. It needs to be the most consistent."}, {"t": "p", "text": "This section treats brand trust as something built the same way clinical safety is built \u2014 through consistent, documented, repeatable behaviour \u2014 rather than through a nicer logo or a louder social media page."}, {"t": "h2", "text": "A.2 The Six Pillars of a Trusted Healthcare Brand"}, {"t": "h3", "text": "Pillar 1 \u2014 Consistency of Clinical Experience"}, {"t": "p", "text": "Trust collapses the moment a patient's second visit feels different from their first \u2014 a different wait time, a different tone from staff, a different answer to the same question. This is precisely what the Structure Plan's SOPs exist to prevent. A brand is not what you say about yourself; it is what a patient can reliably predict will happen every time they walk in. Facilities should treat SOP compliance itself as a brand asset, not merely an operational one."}, {"t": "h3", "text": "Pillar 2 \u2014 Transparent, Predictable Pricing"}, {"t": "p", "text": "Unclear or inconsistent pricing is one of the fastest ways to destroy trust in the Nigerian healthcare market, where patients routinely compare notes with friends and family about \u201cwhat they were charged.\u201d A facility that displays its price list openly, explains costs before treatment, and applies the same price to the same service regardless of who is asking builds a reputation that travels by word of mouth faster than any advertisement."}, {"t": "h3", "text": "Pillar 3 \u2014 The Physical Environment as a Trust Signal"}, {"t": "p", "text": "Patients form a judgement about clinical competence within seconds of entering a facility, based entirely on non-clinical cues: a clean, uncluttered waiting area; visible hand sanitizer; staff in clean, complete uniform; a front desk that is calm rather than chaotic. These cues do the work of reassurance before a single clinical word is spoken. Facility Maintenance and Front Desk SOPs are, in this light, brand-building functions."}, {"t": "h3", "text": "Pillar 4 \u2014 Staff Conduct and Empathy"}, {"t": "p", "text": "Clinical skill earns respect; empathy earns loyalty. Patients rarely have the expertise to judge whether a diagnosis was clinically excellent, but they always notice whether they were listened to, spoken to kindly, and kept informed. Every SOP in the Structure Plan that governs communication \u2014 informed consent, complaint handling, discharge counselling \u2014 is doing double duty as a brand-loyalty mechanism."}, {"t": "h3", "text": "Pillar 5 \u2014 Community Presence and Social Proof"}, {"t": "p", "text": "In Nigerian communities, reputation is built socially long before it is built digitally \u2014 through churches, mosques, market associations, schools, and neighbourhood associations. A facility that shows up consistently in these spaces, especially through the preventive health outreach described in Section B, earns a level of community trust that no billboard can replicate."}, {"t": "h3", "text": "Pillar 6 \u2014 Digital Reputation Management"}, {"t": "p", "text": "Google reviews, Facebook, Instagram, and WhatsApp status updates now shape a patient's first impression before they ever call the facility. This is not optional infrastructure for a modern Nigerian healthcare SME; it is the front desk's digital equivalent. The sections below set out how to manage this deliberately rather than leaving it to chance."}, {"t": "h2", "text": "A.3 Building the Brand Identity Itself"}, {"t": "p", "text": "Before reputation can be managed, an identity must exist to be reputable. At minimum, every healthcare SME should have:"}, {"t": "bullets", "items": [{"lead": "A consistent visual identity", "text": " \u2014 name, logo, colours, and typography applied consistently across signage, documents, uniforms, and digital platforms, with no unofficial variations circulating."}, {"lead": "A clear brand promise", "text": " \u2014 a short, honest statement of what the facility promises patients, used consistently in all communication (SeamFlow's own \u201cClarity. Structure. Growth.\u2122\u201d is a working example of this discipline)."}, {"lead": "Branded patient collateral", "text": " \u2014 patient information leaflets, consent forms, invoices, and signage that all carry the same look, so a patient recognises the facility's materials instantly."}, {"lead": "A defined service manner", "text": " \u2014 the same standard of dress, greeting, and courtesy expected of every staff member who interacts with patients, documented in the Patient & Customer Experience SOPs."}]}, {"t": "h2", "text": "A.4 Managing Reviews, Testimonials, and Word of Mouth"}, {"t": "p", "text": "Word of mouth in Nigerian healthcare travels through three channels that require three different disciplines:"}, {"t": "h3", "text": "In-Person and Community Word of Mouth"}, {"t": "p", "text": "Driven entirely by the six pillars above. No marketing technique substitutes for a patient having a good experience and telling their neighbour about it."}, {"t": "h3", "text": "Online Reviews (Google, Facebook, HMO Portals)"}, {"t": "numbered", "items": [{"text": "Request a review from satisfied patients at the point of positive feedback, not randomly \u2014 the Patient Feedback SOP is the natural trigger point."}, {"text": "Respond to every review, positive or negative, professionally and within a defined window."}, {"text": "Never argue with a negative reviewer publicly; acknowledge the concern, take it offline, and resolve it through the Complaint Resolution SOP."}, {"text": "Never fabricate or incentivise fake reviews \u2014 this breaches ARCON and FCCPC advertising-standard expectations and is easily detected by patients and platforms alike."}]}, {"t": "h3", "text": "Patient Testimonials Used in Marketing"}, {"t": "numbered", "items": [{"text": "Obtain explicit written consent before using any patient's story, image, or words in marketing material, per NDPA 2023."}, {"text": "Never imply a clinical outcome that cannot be guaranteed for other patients."}, {"text": "Favour specific, credible detail (\u201cI was seen within 20 minutes and my daughter's fever was properly explained to me\u201d) over generic praise, which reads as inauthentic."}]}, {"t": "h2", "text": "A.5 Crisis and Reputation Management"}, {"t": "p", "text": "Even a well-run facility will eventually face a negative event \u2014 a poor outcome, a public complaint, a viral social media post. How the facility responds in the first 24 hours determines whether trust is dented or destroyed."}, {"t": "numbered", "items": [{"text": "Acknowledge the concern publicly and promptly; silence is read as guilt, not caution."}, {"text": "Route every serious incident through the Risk Management department's Sentinel Event Review process before any public statement is finalised, so the response is accurate, not reactive."}, {"text": "Never discuss clinical specifics of a named patient's case publicly, even in the facility's own defence \u2014 this is both an NDPA and a trust violation."}, {"text": "Designate one spokesperson, typically the Medical Director or Facility Administrator, so the facility speaks with one consistent voice."}, {"text": "Follow up publicly once the matter is resolved, where appropriate, to show the concern was taken seriously through to conclusion."}]}, {"t": "h2", "text": "A.6 Measuring Brand Trust"}, {"t": "p", "text": "Brand trust should be measured with the same discipline as any clinical KPI, using the Marketing & Business Development and Patient Experience KPIs \u2014 principally Net Promoter Score, patient retention rate, online review rating, and referral conversion rate. A facility that is genuinely building trust will see these four numbers move together, upward, over time."}]}, {"key": "preventive_health", "letter": "B", "title": "Preventive Healthcare & Community Health Education", "subtitle": "Building a healthier community and a more trusted facility, at the same time", "blocks": [{"t": "h2", "text": "B.1 Why Preventive Health Is a Growth Strategy, Not Just Goodwill"}, {"t": "p", "text": "Most Nigerian healthcare SMEs treat community health education as charity \u2014 a nice thing to do when resources allow. This is a missed opportunity. A structured preventive health programme does three things simultaneously: it genuinely reduces illness and suffering in the surrounding community, in direct alignment with the Federal Ministry of Health and NPHCDA's primary health care goals; it builds exactly the kind of community trust and word-of-mouth described in Section A; and it creates a steady, low-cost channel of new patients who already know and trust the facility before they ever need treatment."}, {"t": "quote", "text": "A community that understands how to prevent illness, and knows exactly where to go when prevention isn't enough, will choose that facility every time."}, {"t": "h2", "text": "B.2 Structuring a Community Health Education Programme"}, {"t": "h3", "text": "Core Topic Calendar"}, {"t": "p", "text": "A facility should not attempt everything at once. A simple, recurring monthly topic calendar, repeated annually and refreshed with local disease patterns, is far more sustainable than sporadic large events. A representative twelve-month calendar for a general Nigerian healthcare SME:"}, {"t": "bullets", "items": [{"lead": "Hypertension:", "text": " blood pressure awareness and free screening."}, {"lead": "Diabetes:", "text": " nutrition, exercise, and early warning signs."}, {"lead": "Malaria prevention:", "text": " net use, prompt testing, and treatment-seeking behaviour."}, {"lead": "Maternal health:", "text": " antenatal attendance, danger signs in pregnancy, skilled birth attendance."}, {"lead": "Child immunization:", "text": " routine immunization schedules and catch-up vaccination."}, {"lead": "Hygiene & sanitation:", "text": " handwashing, safe water, and sanitation practices."}, {"lead": "Nutrition:", "text": " balanced diets accessible on a typical Nigerian household budget."}, {"lead": "Family planning:", "text": " contraceptive choices and reproductive health rights."}, {"lead": "Mental health awareness:", "text": " recognising depression, anxiety, and reducing stigma around seeking help."}, {"lead": "Seasonal illness preparedness:", "text": " tailored to local seasonal patterns (respiratory illness, cholera risk in flood season, meningitis in dry season)."}, {"lead": "Cancer awareness (breast, cervical, prostate):", "text": " self-examination and the value of early presentation."}, {"lead": "Accident and emergency preparedness:", "text": " recognising warning signs and knowing when and where to seek emergency care."}]}, {"t": "h3", "text": "Delivery Channels"}, {"t": "p", "text": "A programme reaches further when it uses several channels rather than relying on any single one:"}, {"t": "numbered", "items": [{"text": "Regular outreach health talks at markets, churches, mosques, and community halls, delivered by rotating clinical staff as part of their community engagement responsibility."}, {"text": "School health talks and screening days, partnering with local school administrators \u2014 a channel that also reaches entire households through the children."}, {"text": "Free or subsidised screening camps (blood pressure, blood glucose, BMI) held periodically at the facility or in the community, which double as a respectful, low-pressure introduction to the facility for people who have never used it."}, {"text": "Social media health content \u2014 short, accurate, locally relevant posts scheduled through the Marketing & Business Development department's content calendar."}, {"text": "SMS or WhatsApp broadcast health tips to the facility's existing patient database, respecting NDPA 2023 consent requirements."}, {"text": "Partnership with local radio, where affordable, for a periodic health tip segment \u2014 still one of the most trusted mass-reach channels in many Nigerian communities."}]}, {"t": "h2", "text": "B.3 Partnering with Public Health Structures"}, {"t": "p", "text": "A private healthcare SME does not need to build community health infrastructure alone. Local Government Area health departments, NPHCDA-affiliated primary health centres, and NGOs frequently run immunization drives, health awareness weeks, and screening campaigns that a private facility can partner with \u2014 lending clinical staff, screening equipment, or venue space in exchange for visibility and credibility by association."}, {"t": "h2", "text": "B.4 Screening Camps as a Structured Funnel"}, {"t": "p", "text": "A screening camp should never be a one-off event with no follow-through. Every camp should follow a simple, documented sequence: screen, record findings against the patient's name and contact, flag any abnormal result for a specific follow-up appointment, and track how many screened individuals convert into registered patients. This turns a goodwill activity into a measurable growth channel without compromising its genuine public health value."}, {"t": "h2", "text": "B.5 Measuring Community Impact"}, {"t": "bullets", "items": [{"lead": "Community reach:", "text": " number of individuals attending outreach talks or screening camps."}, {"lead": "Screening volume:", "text": " number of screenings performed and abnormal findings identified."}, {"lead": "Follow-up conversion rate:", "text": " % of flagged abnormal findings who attend the recommended follow-up appointment."}, {"lead": "New patient conversion rate:", "text": " % of screened individuals who become registered patients within six months."}, {"lead": "Programme consistency:", "text": " topics covered against the planned annual calendar."}]}, {"t": "p", "text": "These metrics should be reported by the Marketing & Business Development department alongside its other KPIs, since community health education is, in practice, this department's most credible and sustainable growth activity."}]}, {"key": "kpi_dashboards", "letter": "C", "title": "KPI Dashboards for All 22 Departments", "subtitle": "What gets measured gets managed \u2014 five KPIs for every department in your facility", "intro_blocks": [{"t": "p", "text": "Every department documented in the Structure Plan is given five Key Performance Indicators here \u2014 110 KPIs in total. Each KPI states what to measure, how to define it, the target a well-run Nigerian healthcare SME should aim for, how often to review it, and who owns it. These are starting targets, not fixed rules \u2014 a facility should adjust thresholds as its own baseline data accumulates, but should not abandon measurement altogether."}, {"t": "bullets", "items": [{"lead": "Reporting cadence:", "text": " compile departmental KPIs monthly and present them at the management meeting defined in the Leadership & Governance SOPs."}, {"lead": "Escalation trigger:", "text": " any KPI missing its target for two consecutive reporting periods should trigger a documented root-cause discussion, not just a note that it was missed."}, {"lead": "Relationship to the Clarity Plan audit:", "text": " these 110 KPIs, together with the Business Systems Audit Scorecard, form the complete measurement layer of the SeamFlow Operating System \u2014 what Section F calls the quarterly audit cycle."}]}, {"t": "h2", "text": "Applying a Status to Each KPI Once You Have Real Data"}, {"t": "p", "text": "Once a department begins recording its actual monthly figure against each target, apply the same three-tier status framework SeamFlow uses across its KPI Dashboard product:"}, {"t": "bullets", "items": [{"lead": "ON TRACK:", "text": " the actual figure is meeting or exceeding the target benchmark."}, {"lead": "WATCH:", "text": " the actual figure is within a small, defined tolerance of the target and should be monitored, not yet escalated."}, {"lead": "ALERT:", "text": " the actual figure is outside the acceptable range and requires an immediate, documented corrective action."}]}, {"t": "p", "text": "Recording a trend note alongside each figure \u2014 up, down, or stable versus the prior month \u2014 turns this from a static target list into a live departmental dashboard."}], "departments": [{"name": "Front Desk & Patient Registration", "kpis": [["Patient Registration Accuracy Rate", "% of registrations completed with no data errors", "\u226598%", "Monthly", "Front Desk Supervisor"], ["Average Registration Time", "Minutes from arrival to registration completed", "\u22645 minutes", "Weekly", "Front Desk Supervisor"], ["Triage Compliance Rate", "% of patients triaged within 15 minutes of arrival", "100%", "Daily", "Triage Nurse / Front Desk Supervisor"], ["Non-Urgent Queue Wait Time", "Average minutes waiting for Level 3\u20134 patients", "\u226430 minutes", "Daily", "Patient Flow Coordinator"], ["Front Desk Complaint Resolution Time", "Average hours to resolve a front-desk complaint", "\u226424 hours", "Monthly", "Patient Experience Officer"]], "type": "Administration", "overview": "The front-line intake function for every patient encounter \u2014 verifying identity, confirming coverage, and routing patients efficiently while protecting data accuracy and privacy."}, {"name": "Patient & Customer Experience", "kpis": [["Net Promoter Score (NPS)", "Likelihood-to-recommend score from patient surveys", "\u226550", "Monthly", "Patient Experience Officer"], ["Complaint Resolution Rate Within SLA", "% of complaints resolved inside the stated timeframe", "\u226595%", "Monthly", "Patient Experience Officer"], ["Patient Satisfaction Score", "Average rating from post-visit surveys", "\u22654.5 / 5", "Monthly", "Patient Experience Officer"], ["Post-Discharge Follow-Up Completion", "% of discharged patients contacted within 72 hours", "\u226590%", "Monthly", "Nursing Team"], ["Informed Consent Documentation Rate", "% of applicable procedures with signed consent on file", "100%", "Monthly", "Quality Officer"]], "type": "Administration", "overview": "The function responsible for how patients feel about their journey through the facility, from communication and consent to complaint resolution and follow-up."}, {"name": "Nursing & Inpatient Operations", "kpis": [["Medication Error Rate", "Errors per 1,000 doses administered", "<2", "Monthly", "Nurse-in-Charge"], ["Shift Handover Completion Rate", "% of shifts with a fully documented handover", "100%", "Daily", "Nurse-in-Charge"], ["Observation Compliance Rate", "% of scheduled vital-sign checks completed on time", "\u226598%", "Daily", "Ward Nurse"], ["Average Escalation Response Time", "Minutes from deterioration flag to doctor review", "\u226415 minutes", "Monthly", "Nurse-in-Charge"], ["Wound/Pressure Injury Rate", "% of applicable patients developing a new wound complication", "<2%", "Monthly", "Nurse-in-Charge"]], "type": "Clinical", "overview": "The clinical backbone of inpatient care \u2014 covering shift handover, medication safety, observation, and escalation of deteriorating patients."}, {"name": "HMO & Claims Management", "kpis": [["Claims Rejection Rate", "% of submitted claims rejected by HMOs", "<5%", "Monthly", "Claims Officer"], ["Average Claims Turnaround Time", "Days from claim submission to payment received", "\u226430 days", "Monthly", "HMO Relationship Manager"], ["Pre-Authorization Compliance Rate", "% of HMO treatments authorized before service", "100%", "Monthly", "HMO Desk Officer"], ["Aged Receivables Ratio", "% of HMO receivables outstanding beyond 60 days", "<10%", "Monthly", "Finance Officer"], ["Capitation Reconciliation Accuracy", "% variance between enrolled and reconciled capitation lists", "<2%", "Monthly", "HMO Desk Officer"]], "type": "Revenue", "overview": "The revenue-protection function that manages pre-authorization, claims submission, and reconciliation with HMO and insurance partners."}, {"name": "Pharmacy", "kpis": [["Essential Medicine Stock-Out Rate", "% of days any essential medicine is out of stock", "0%", "Monthly", "Pharmacist-in-Charge"], ["STAT Dispensing Compliance", "% of STAT prescriptions dispensed within 15 minutes", "\u226595%", "Monthly", "Pharmacy Manager"], ["Expired Stock Value Ratio", "Value of expired stock as % of total inventory value", "<1%", "Monthly", "Pharmacist-in-Charge"], ["Dispensing Error Rate", "Errors per 1,000 items dispensed", "<1", "Monthly", "Pharmacist-in-Charge"], ["Controlled Substance Reconciliation Accuracy", "% match between physical count and register", "100%", "Weekly", "Pharmacist-in-Charge"]], "type": "Clinical Support", "overview": "The medication supply chain function, covering safe dispensing, inventory control, and regulatory compliance for all drug stock."}, {"name": "Laboratory & Diagnostics", "kpis": [["STAT Turnaround Time Compliance", "% of STAT results delivered within 60 minutes", "\u226595%", "Weekly", "Lab Manager"], ["Specimen Rejection Rate", "% of received samples rejected", "<2%", "Monthly", "Lab Manager"], ["Critical Value Notification Time", "Average minutes from confirmation to clinician notification", "\u226415 minutes", "Monthly", "Lab Manager"], ["Quality Control Pass Rate", "% of QC runs passing on first attempt", "\u226598%", "Daily", "Medical Laboratory Scientist"], ["Result Repeat/Error Rate", "% of results requiring a repeat due to processing error", "<1%", "Monthly", "Lab Manager"]], "type": "Clinical Support", "overview": "The diagnostic engine of the facility \u2014 covering sample handling, quality-controlled testing, and timely, accurate result reporting."}, {"name": "Surgery & Theatre Operations", "kpis": [["Surgical Safety Checklist Compliance", "% of procedures with a fully completed checklist", "100%", "Every case", "Theatre Coordinator"], ["Theatre Utilization Rate", "% of scheduled theatre time actually used", "\u226575%", "Monthly", "Theatre Coordinator"], ["Surgical Site Infection Rate", "% of surgical cases developing a site infection", "<3%", "Monthly", "Infection Prevention & Control Officer"], ["Same-Day Case Cancellation Rate", "% of scheduled cases cancelled on the day", "<5%", "Monthly", "Theatre Coordinator"], ["Instrument/Swab Count Discrepancy Rate", "% of cases with an unresolved count discrepancy", "0%", "Every case", "Scrub Nurse"]], "type": "Clinical", "overview": "The highest-risk clinical environment in the facility, requiring strict, checklist-driven protocols from scheduling through to post-operative handover."}, {"name": "Finance & Billing", "kpis": [["Days Sales Outstanding (DSO)", "Average days to collect payment after billing", "<30 days", "Monthly", "Finance Officer"], ["Cash Reconciliation Variance", "% variance between recorded and physical cash", "<0.5%", "Daily", "Cashier / Finance Officer"], ["Billing Accuracy Rate", "% of invoices issued without correction", "\u226598%", "Monthly", "Billing Officer"], ["Statutory Remittance Timeliness", "% of tax and statutory payments made on time", "100%", "Monthly", "Finance Officer"], ["Bad Debt Ratio", "Written-off revenue as % of total billed revenue", "<3%", "Quarterly", "Finance Officer"]], "type": "Revenue", "overview": "The financial control centre of the facility, covering patient billing, cash handling, payroll, and financial reporting."}, {"name": "Procurement & Supply Chain", "kpis": [["Purchase Order Cycle Time", "Days from requisition to purchase order issued", "\u22643 days", "Monthly", "Procurement Officer"], ["Vendor On-Time Delivery Rate", "% of orders delivered by the agreed date", "\u226590%", "Monthly", "Procurement Officer"], ["Emergency Procurement Ratio", "Emergency purchases as % of total purchase volume", "<10%", "Monthly", "Procurement Officer"], ["Negotiated Cost Savings", "% price reduction achieved vs prior contract terms", "\u22655% annually", "Annually", "Procurement Officer"], ["Goods Receipt Discrepancy Rate", "% of deliveries with a quantity or quality issue", "<5%", "Monthly", "Store Officer"]], "type": "Operations", "overview": "The function that keeps every department stocked, through disciplined vendor selection, purchasing, and goods verification."}, {"name": "Facility Maintenance", "kpis": [["Preventive Maintenance Compliance Rate", "% of scheduled maintenance tasks completed on time", "\u226595%", "Monthly", "Facility Maintenance Officer"], ["Average Repair Resolution Time", "Hours from fault report to resolution", "\u226424 hours", "Monthly", "Facility Maintenance Officer"], ["Power Backup Uptime", "% successful automatic changeover on test", "100%", "Monthly", "Facility Maintenance Officer"], ["Fire Safety Inspection Compliance", "% of scheduled fire safety inspections completed", "100%", "Monthly", "Facility Maintenance Officer"], ["Waste Disposal Compliance Rate", "% of waste collections with a valid disposal certificate", "100%", "Monthly", "Facility Maintenance Officer"]], "type": "Operations", "overview": "The function that keeps the physical facility safe, functional, and compliant, from power and water systems to cleaning and fire safety."}, {"name": "Equipment & Biomedical Maintenance", "kpis": [["Equipment Uptime Rate", "% of scheduled operating time equipment is functional", "\u226595%", "Monthly", "Biomedical Officer"], ["Calibration Compliance Rate", "% of equipment calibrated on schedule", "100%", "Monthly", "Biomedical Officer"], ["Average Equipment Downtime", "Hours per breakdown incident", "<24 hours", "Monthly", "Biomedical Officer"], ["Critical Equipment Backup Availability", "% of critical equipment with a confirmed backup plan", "100%", "Quarterly", "Biomedical Officer"], ["Breakdown Recurrence Rate", "% of faults recurring within 30 days of repair", "<10%", "Quarterly", "Biomedical Officer"]], "type": "Operations", "overview": "The function responsible for the reliability and safety of medical equipment, from procurement through calibration to decommissioning."}, {"name": "Facility Security", "kpis": [["Security Incident Rate", "Number of security incidents per month", "<2", "Monthly", "Security Officer"], ["Restricted-Area Access Breach Count", "Unauthorized access incidents to sensitive areas", "0", "Monthly", "Security Officer"], ["Visitor Log Completion Rate", "% of visitors logged with full details", "100%", "Daily", "Security Officer"], ["CCTV Uptime", "% of cameras functional and recording", "\u226598%", "Monthly", "Security Officer"], ["Newborn Identification Compliance", "% of infant ID band checks completed as required", "100%", "Daily", "Maternity Nurse"]], "type": "Operations", "overview": "The function protecting patients, staff, and assets through access control, surveillance, and emergency response protocols."}, {"name": "Quality, Compliance & Infection Prevention", "kpis": [["Hand Hygiene Compliance Rate", "% compliance on direct observation audits", "\u226590%", "Monthly", "Infection Prevention & Control Officer"], ["Incident & Near-Miss Reporting Rate", "Number of reports logged per month", "Increasing trend", "Monthly", "Quality Officer"], ["Internal Audit Score", "Average department compliance score at internal audit", "\u226580%", "Quarterly", "Quality Officer"], ["Corrective Action Closure Rate", "% of agreed corrective actions closed by deadline", "\u226590%", "Monthly", "Quality Officer"], ["Regulatory Compliance Status", "% of licenses and certifications currently valid", "100%", "Continuous", "Facility Administrator"]], "type": "Governance", "overview": "The function that safeguards clinical standards, regulatory compliance, and infection control across every department."}, {"name": "HR & Workforce Administration", "kpis": [["Staff Turnover Rate", "Annualized % of staff exiting the organization", "<10%", "Quarterly", "HR Officer"], ["Time-to-Hire", "Average days from vacancy approval to offer accepted", "\u226421 days", "Monthly", "HR Officer"], ["Onboarding Completion Rate", "% of new hires completing the full onboarding checklist", "100%", "Monthly", "HR Officer"], ["Training Hours per Staff Member", "Average hours of documented training per staff per year", "\u226520 hours", "Annually", "HR Officer"], ["Employee Satisfaction Score", "Average score from staff engagement survey", "\u22654 / 5", "Bi-annually", "HR Officer"]], "type": "Support", "overview": "The people function \u2014 covering recruitment, onboarding, performance, scheduling, and the systems that keep staff engaged and compliant."}, {"name": "Medical Records & Health Information", "kpis": [["Record Retrieval Turnaround Time", "Average minutes from request to file delivered", "\u226410 minutes", "Monthly", "Records Officer"], ["Filing Accuracy Rate", "% of files correctly filed on spot-check", "\u226598%", "Monthly", "Records Officer"], ["NHMIS/DHIS2 Reporting Timeliness", "% of monthly submissions made on time", "100%", "Monthly", "Records Officer"], ["Record Amendment Rate", "% of records requiring a post-hoc correction", "<2%", "Monthly", "Records Officer"], ["Confidentiality Breach Count", "Number of confirmed unauthorized disclosures", "0", "Continuous", "Data Protection Focal Person"]], "type": "Administration", "overview": "The custodian function for patient information, ensuring records are complete, retrievable, confidential, and compliant with retention requirements."}, {"name": "Leadership & Governance", "kpis": [["Management Meeting Compliance", "% of scheduled leadership meetings held as planned", "100%", "Monthly", "Facility Administrator"], ["Policy Currency Rate", "% of policies reviewed within their due cycle", "100%", "Annually", "Facility Administrator"], ["Departmental KPI Reporting Completeness", "% of departments submitting KPI reports on time", "\u226595%", "Monthly", "Facility Administrator"], ["License & Accreditation Currency", "% of facility licenses currently valid and up to date", "100%", "Continuous", "Facility Administrator"], ["Strategic Goal Achievement Rate", "% of annual strategic goals achieved", "\u226580%", "Annually", "Facility Administrator"]], "type": "Governance", "overview": "The oversight function that sets direction, ensures accountability, and holds every other department to a consistent operating standard."}, {"name": "Accident & Emergency", "kpis": [["Triage Time Compliance", "% of patients triaged within 15 minutes", "100%", "Daily", "A&E Nurse-in-Charge"], ["Door-to-Doctor Time", "Average minutes from arrival to first clinician review", "\u226430 minutes", "Daily", "A&E Doctor-in-Charge"], ["Resuscitation Response Time", "Minutes from emergency call to team at bedside", "\u22642 minutes", "Every case", "A&E Nurse-in-Charge"], ["Preventable A&E Mortality Rate", "% of A&E deaths assessed as potentially preventable", "Minimize / trend to zero", "Monthly", "Medical Director"], ["Left-Without-Being-Seen Rate", "% of A&E patients who leave before assessment", "<2%", "Monthly", "A&E Nurse-in-Charge"]], "type": "Clinical", "overview": "The most time-critical department in the facility, requiring immediate triage, rapid escalation, and tightly coordinated handover."}, {"name": "Information Management", "kpis": [["Data Backup Success Rate", "% of scheduled backups completed successfully", "100%", "Daily", "IT/Systems Administrator"], ["System Access Review Completion", "% of scheduled quarterly access reviews completed", "100%", "Quarterly", "IT/Systems Administrator"], ["Confidentiality Breach Rate", "Number of confirmed data breaches", "0", "Continuous", "Data Protection Focal Person"], ["Same-Day Documentation Rate", "% of clinical entries completed the same day of care", "\u226595%", "Monthly", "Health Information Officer"], ["Retention Schedule Compliance", "% of records handled per the approved retention schedule", "100%", "Annually", "Health Information Officer"]], "type": "Support", "overview": "Governs the capture, security, and lawful use of health and business information across every format \u2014 paper, EMR, registers, images \u2014 distinct from the physical custody role of Medical Records."}, {"name": "Patient Referral & Care Coordination", "kpis": [["Urgent Referral Turnaround Time", "Hours from referral decision to patient transfer", "\u22642 hours", "Monthly", "Attending Doctor"], ["Referral Feedback Rate", "% of referrals receiving feedback from the receiving provider", "\u226580%", "Monthly", "Business Development Officer"], ["Emergency Referral Follow-Up Completion", "% of emergency referrals followed up within 24 hours", "100%", "Monthly", "Nurse on Duty"], ["Referral Partner Directory Currency", "% of directory entries verified as current", "100%", "Bi-annually", "Medical Director"], ["Inward Referral Registration Time", "Average minutes to register a referred-in patient", "\u226410 minutes", "Monthly", "Front Desk / Triage Nurse"]], "type": "Clinical Support", "overview": "Standardises how patients are referred outward to higher levels of care or specialists, and received inward from other providers, ensuring safety and continuity across the handover."}, {"name": "Risk Management", "kpis": [["Risk Register Review Currency", "% of logged risks reviewed on the scheduled cycle", "100%", "Quarterly", "Risk & Quality Focal Person"], ["Incident Reporting Rate", "Number of incidents and near-misses logged per month", "Trend monitored, no suppression", "Monthly", "Risk & Quality Focal Person"], ["Sentinel Event Review Compliance", "% of sentinel events reviewed within 72 hours", "100%", "Continuous", "Medical Director"], ["Business Continuity Test Completion", "% of continuity plan elements tested in the year", "100%", "Annually", "Facility Administrator"], ["High-Risk Mitigation Closure Rate", "% of Medium-or-above risks closed by target date", "\u226590%", "Quarterly", "Risk & Quality Focal Person"]], "type": "Governance", "overview": "Identifies, assesses, and controls clinical, operational, financial, and reputational risk facility-wide, distinct from the day-to-day compliance monitoring done by Quality & IPC."}, {"name": "Radiology & Imaging", "kpis": [["Routine Imaging Turnaround Time", "Hours from scan completion to signed report", "\u226424 hours", "Monthly", "Radiologist"], ["Repeat/Reject Image Rate", "% of examinations requiring a repeat", "<5%", "Monthly", "Radiographer"], ["Cardiac ECG Review Time", "Minutes from ECG acquisition to clinician review", "\u226410 minutes", "Monthly", "Attending Clinician"], ["Radiation Safety Compliance Rate", "% of examinations following shielding/exposure protocol", "100%", "Monthly", "Radiographer"], ["Imaging Equipment Uptime", "% of scheduled operating time equipment is functional", "\u226595%", "Monthly", "Biomedical Officer"]], "type": "Clinical Support", "overview": "Covers X-ray, ultrasound, and other imaging services from request through to reporting, distinct from the Laboratory's sample-based diagnostics."}, {"name": "Marketing & Business Development", "kpis": [["New Patient Growth Rate", "% month-on-month growth in new patient registrations", "\u22655%", "Monthly", "Marketing & BD Manager"], ["Patient Retention Rate", "% of patients returning within 12 months", "\u226560%", "Quarterly", "Marketing & BD Manager"], ["Physician Referral Conversion Rate", "% of physician referrals converted to visits", "\u226550%", "Monthly", "Business Development Officer"], ["Social Media Engagement Rate", "Engagement actions as % of total reach", "\u22653%", "Monthly", "Digital Marketing Officer"], ["Corporate/HMO Partnership Growth", "New signed agreements per quarter", "\u22652 per quarter", "Quarterly", "Business Development Officer"]], "type": "Growth", "overview": "Grows the patient base, builds brand reputation, develops referral and corporate partnerships, and retains existing patients \u2014 a strategic function alongside clinical and operational departments."}]}, {"key": "workforce", "letter": "D", "title": "Workforce Excellence", "subtitle": "Hiring, onboarding, training, performance, compensation, and career growth for a low-turnover team", "blocks": [{"t": "h2", "text": "D.1 Why Workforce Strategy Determines Everything Else"}, {"t": "p", "text": "Every SOP in the Structure Plan, every KPI in Section C, and every trust-building behaviour in Section A depends entirely on the people executing them, every day, without a consultant standing over their shoulder. Staff turnover is the single greatest threat to everything SeamFlow has helped build \u2014 a facility that loses a trained nurse every few months is permanently stuck re-teaching the basics, never advancing to consistency. This section treats workforce strategy as core infrastructure, not an HR side function."}, {"t": "h2", "text": "D.2 Hiring: Recruiting for Competence and Character"}, {"t": "numbered", "items": [{"text": "Write a specific job description for every vacancy, stating required qualifications, licensing body registration, years of experience, and the specific competencies the role demands \u2014 not a generic template reused across roles."}, {"text": "Source candidates through multiple channels: professional body job boards (MDCN, NMCN, PCN, MLSCN often have placement or alumni networks), staff referrals with a small referral incentive, and local nursing/allied health training institutions."}, {"text": "Verify every clinical candidate's licence status directly with the relevant regulatory body before an offer is made \u2014 never rely solely on a presented certificate."}, {"text": "Use a structured interview with a scoring rubric covering both technical competence and patient-facing conduct; a technically excellent candidate who cannot communicate with patients will undermine the brand trust built in Section A."}, {"text": "Conduct at least two reference checks focused specifically on reliability, integrity, and how the candidate handled a past mistake \u2014 not just confirmation of dates of employment."}, {"text": "Be transparent about compensation, working hours, and on-call expectations at the offer stage; unmet expectations are one of the leading causes of early resignation."}]}, {"t": "h2", "text": "D.3 Onboarding: The First 90 Days"}, {"t": "p", "text": "A structured onboarding programme is one of the highest-leverage retention tools available, because most preventable early exits happen in the first three months, when a new hire is deciding whether the facility matches what they were promised."}, {"t": "h3", "text": "Day One"}, {"t": "bullets", "items": [{"lead": "Everything ready in advance:", "text": " workstation, access credentials, uniform, and ID badge should all be ready before the new hire arrives, not assembled while they wait."}, {"lead": "Facility-wide orientation:", "text": " covering the facility's mission, policies, safety procedures, and code of conduct, per the HR Onboarding SOP."}, {"lead": "A designated buddy:", "text": " a named senior colleague responsible for answering questions and helping the new hire feel welcome in the first two weeks."}]}, {"t": "h3", "text": "First 30 Days"}, {"t": "bullets", "items": [{"lead": "Department-specific SOP orientation:", "text": " the new hire is walked through their department's specific SOPs from the Structure Plan, not left to infer them by observation."}, {"lead": "30-day performance expectations set:", "text": " clear, written expectations for what competent performance looks like by day 30."}]}, {"t": "h3", "text": "60 and 90 Days"}, {"t": "bullets", "items": [{"lead": "60-day review:", "text": " a documented check-in on progress, challenges, and any additional training needed."}, {"lead": "90-day formal review:", "text": " formal confirmation of successful onboarding, or a documented extension with specific support if needed \u2014 never a silent assumption that \u201cthey'll figure it out.\u201d"}]}, {"t": "h2", "text": "D.4 Training and Continuing Professional Development"}, {"t": "p", "text": "In Nigeria, most clinical professional bodies \u2014 MDCN, NMCN, PCN, MLSCN, and the Radiographers Registration Board \u2014 require documented Continuing Professional Development (CPD) points for licence renewal. A facility that actively supports this, rather than leaving it entirely to the individual, becomes measurably more attractive to skilled staff."}, {"t": "numbered", "items": [{"text": "Maintain a facility-wide annual training calendar covering both mandatory CPD-relevant topics and facility-specific SOP refreshers."}, {"text": "Track each staff member's CPD points and licence renewal dates centrally, flagging upcoming renewals at least 90 days ahead \u2014 an extension of the HR licensing-tracking SOP."}, {"text": "Where budget allows, sponsor or subsidise external CPD courses and conferences for high-performing staff, treated as a retention investment rather than a cost."}, {"text": "Use internal case reviews, morbidity and mortality meetings, and skills refreshers as a low-cost, high-value ongoing training mechanism."}, {"text": "Pair every new SOP or protocol update from the Structure Plan with a short training session \u2014 a documented SOP that is never explained to staff is not truly implemented."}]}, {"t": "h2", "text": "D.5 Performance Management"}, {"t": "p", "text": "Performance management should be continuous, not an annual event that surprises everyone."}, {"t": "numbered", "items": [{"text": "Set individual performance expectations directly linked to the relevant department's KPIs from Section C, so staff understand exactly how their work is measured."}, {"text": "Conduct a formal documented performance review for every staff member at least annually, with informal check-ins at least quarterly."}, {"text": "Balance clinical/technical performance with the patient-conduct standards described in Section A \u2014 a technically strong but consistently rude staff member is under-performing on a metric that matters just as much."}, {"text": "Address underperformance early and supportively through coaching and retraining before escalating to formal disciplinary action, per the HR Disciplinary & Grievance SOP."}, {"text": "Recognise and publicly acknowledge strong performance \u2014 through staff-of-the-month recognition, mention at management meetings, or small tangible rewards \u2014 since recognition is consistently shown to affect retention more than its cost would suggest."}]}, {"t": "h2", "text": "D.6 Compensation and Benefits"}, {"t": "p", "text": "Nigerian healthcare SMEs rarely compete with teaching hospitals or multinational players on raw salary alone \u2014 but salary is only one part of what determines whether a good employee stays."}, {"t": "h3", "text": "Getting the Base Right"}, {"t": "bullets", "items": [{"lead": "Fair, benchmarked pay:", "text": " benchmark salaries against comparable local facilities and the specific cadre's market rate at least annually; a facility that falls silently behind the market will eventually lose staff to competitors without ever understanding why."}, {"lead": "Statutory compliance as a trust signal:", "text": " full, timely compliance with PAYE tax, pension contributions under the Pension Reform Act, and NSITF contributions is itself a retention factor \u2014 staff notice and discuss when statutory deductions are taken but not correctly remitted."}]}, {"t": "h3", "text": "Benefits That Matter in the Nigerian Context"}, {"t": "bullets", "items": [{"lead": "Health insurance for staff:", "text": " subsidised or fully covered HMO membership for staff and, where affordable, immediate family \u2014 particularly meaningful for healthcare workers who otherwise self-treat."}, {"lead": "Transport allowance or support:", "text": " particularly valuable in facilities with irregular public transport access or late shifts."}, {"lead": "Professional dues subsidy:", "text": " covering or subsidising annual practising licence fees for clinical staff removes a recurring financial stressor."}, {"lead": "On-site meals:", "text": " for facilities with the space, subsidised or free meals during shifts meaningfully improve morale at low cost."}, {"lead": "Shift and on-call allowances:", "text": " a documented, fairly applied system so night and weekend work is compensated consistently, reducing a common source of quiet resentment."}]}, {"t": "h2", "text": "D.7 Career Growth and Retention"}, {"t": "p", "text": "Staff, especially clinical staff early in their careers, will leave a facility with no visible path forward \u2014 regardless of how fair the pay is \u2014 if they cannot see where the role leads next."}, {"t": "numbered", "items": [{"text": "Define a simple career ladder for each major cadre (for example, Staff Nurse \u2192 Senior Staff Nurse \u2192 Ward-in-Charge \u2192 Nurse Manager), with transparent criteria for advancement."}, {"text": "Prioritise internal promotion over external hiring for supervisory and management roles wherever a suitable internal candidate exists \u2014 this is one of the strongest signals a facility can send that loyalty is rewarded."}, {"text": "Offer sponsored specialty training (for example, a nurse pursuing a critical care or theatre specialisation) in exchange for a documented minimum retention commitment."}, {"text": "Involve senior staff in mentoring junior colleagues formally, which benefits both the mentee's growth and the mentor's sense of seniority and investment in the facility."}, {"text": "Conduct a staff engagement survey at least twice yearly and act visibly on the findings \u2014 a survey that produces no visible change trains staff to stop being honest in future surveys."}, {"text": "Conduct a structured exit interview for every departing staff member, per the HR Exit SOP, and review the aggregated reasons for leaving at least quarterly to catch systemic issues before they cause further departures."}]}, {"t": "h2", "text": "D.8 Measuring Workforce Health"}, {"t": "p", "text": "The HR & Workforce Administration KPIs \u2014 staff turnover rate, time-to-hire, training hours per staff, and employee satisfaction score \u2014 should be read together as a single picture. A facility with low turnover but also low training hours and low satisfaction scores may simply have staff who feel unable to leave, not staff who are genuinely engaged; the numbers should be interpreted as a set, not in isolation."}]}, {"key": "expansion", "letter": "E", "title": "Healthcare SME Expansion in Nigeria", "subtitle": "When, where, and how to grow without breaking what already works", "blocks": [{"t": "h2", "text": "E.1 The First Rule of Expansion: Structure Before Scale"}, {"t": "p", "text": "The single most common reason healthcare SME expansions in Nigeria fail is that a founder replicates their location before replicating their systems. A second branch run on informal habits and institutional memory simply multiplies the founder's personal workload and the original chaos, rather than multiplying success. This is precisely why SeamFlow sequences its own offering as Clarity, then Structure, then Growth: a facility should only seriously consider expansion once its current location is running consistently against its Structure Plan SOPs and Section C KPIs without constant founder intervention."}, {"t": "quote", "text": "If a facility cannot run for two weeks without the founder physically present, it is not ready to open a second location \u2014 it is ready to lose control of two."}, {"t": "h2", "text": "E.2 Signals That a Facility Is Ready to Expand"}, {"t": "bullets", "items": [{"lead": "Consistent capacity utilisation:", "text": " the current facility has operated at or above 80% of practical capacity for a sustained period, indicating genuine unmet demand rather than a temporary surge."}, {"lead": "Stable, predictable cash flow:", "text": " revenue growth has been consistent for at least four to six consecutive quarters, not a single unusually strong period."}, {"lead": "Demonstrated operational maturity:", "text": " quarterly Business Systems Audit scores have remained in the Structured tier or above for at least two consecutive cycles."}, {"lead": "A leadership bench:", "text": " the current location has at least one senior staff member capable of running day-to-day operations without the founder present, tested during actual absences."}, {"lead": "Documented systems actually in use:", "text": " SOPs, KPI reporting, and the audit cycle are functioning as documented systems, not as things that exist only on paper."}]}, {"t": "h2", "text": "E.3 Expansion Models Available to a Nigerian Healthcare SME"}, {"t": "h3", "text": "Greenfield Branch"}, {"t": "p", "text": "Opening a wholly new, fully owned location in a new catchment area. Offers full control and brand consistency but requires the most capital and management attention."}, {"t": "h3", "text": "Satellite Clinics or Diagnostic Points"}, {"t": "p", "text": "Smaller, limited-service extensions (for example, a diagnostic sample-collection point or a basic outpatient clinic) that feed into the main facility for anything requiring full capability. Lower capital requirement, faster to launch, and a good way to test a new catchment area before committing to a full branch."}, {"t": "h3", "text": "Franchise or Licensing Model"}, {"t": "p", "text": "Licensing the facility's brand, SOPs, and systems to an independent operator in another location, in exchange for fees and quality oversight. Once a facility's SOPs are mature and consistently followed, expansion no longer has to mean opening and personally running every new location \u2014 the systems themselves become licensable, with quality maintained through the same audit discipline used at the original site."}, {"t": "h3", "text": "Telemedicine Extension"}, {"t": "p", "text": "Extending consultation reach into areas without a physical presence, particularly for follow-up consultations, chronic disease management, and initial triage. Lowest capital requirement of any model, though it cannot substitute for physical diagnostics, procedures, or emergency care."}, {"t": "h3", "text": "Partnership or Acquisition"}, {"t": "p", "text": "Partnering with, investing in, or acquiring an existing smaller facility in a target area, then bringing it up to the Structure Plan standard. Can be faster than greenfield development but requires careful due diligence on the target facility's existing liabilities, licensing status, and reputation."}, {"t": "h2", "text": "E.4 Site Selection Criteria"}, {"t": "numbered", "items": [{"text": "Catchment population size and demographic profile \u2014 does the area have enough people, of the right age and income profile, for the services planned?"}, {"text": "Existing competition density \u2014 how many comparable facilities already serve the area, and what gap in quality or service can this location fill?"}, {"text": "Road access and traffic patterns \u2014 particularly critical for any facility offering emergency or maternity services."}, {"text": "Reliability of power and water supply, and the cost of backup infrastructure where public supply is unreliable."}, {"text": "Local security environment and its implications for the Facility Security SOPs and staff safety."}, {"text": "Proximity to referral partners \u2014 laboratories, imaging centres, or higher-level facilities \u2014 for services the new location will not provide directly."}]}, {"t": "h2", "text": "E.5 The Regulatory Path to a New Facility"}, {"t": "p", "text": "Every new location in Nigeria must independently satisfy its own regulatory obligations \u2014 an existing licence does not transfer automatically to a new address."}, {"t": "numbered", "items": [{"text": "Register the new location with the Corporate Affairs Commission if operating under a distinct legal entity, or update the existing registration as applicable."}, {"text": "Apply for facility registration and licensing with the relevant State Hospital Management Board or facility regulator (such as HEFAMAA in Lagos State), which typically includes a physical inspection."}, {"text": "Register the pharmacy premises separately with the Pharmacists Council of Nigeria if the new location will dispense medication, and register with NAFDAC where applicable."}, {"text": "Confirm that all clinical staff at the new location hold valid, verifiable licences with their respective regulatory bodies for practice in that state."}, {"text": "Register for tax purposes in the new location's jurisdiction where state-level tax registration differs from the original location."}, {"text": "Where the new location offers imaging services, obtain the applicable radiation safety clearance from the Nigerian Nuclear Regulatory Authority."}]}, {"t": "h2", "text": "E.6 Financing Expansion"}, {"t": "bullets", "items": [{"lead": "Retained earnings:", "text": " the lowest-cost, most controllable source of expansion capital, but the slowest to accumulate."}, {"lead": "Bank loans:", "text": " commercial bank facilities, and development-finance-oriented lenders such as the Bank of Industry, which periodically run healthcare-sector financing windows."}, {"lead": "Investor equity:", "text": " bringing in an equity partner in exchange for capital, which dilutes ownership but can substantially accelerate growth and bring valuable sector experience."}, {"lead": "Development finance institutions (DFIs):", "text": " international development finance institutions and impact investors increasingly fund healthcare SME expansion in Nigeria, particularly facilities with strong governance and reporting \u2014 exactly what the Structure Plan and this Growth Plan are designed to demonstrate."}, {"lead": "Vendor or equipment financing:", "text": " equipment-specific financing or leasing arrangements can reduce the upfront capital needed for imaging or laboratory equipment at a new site."}]}, {"t": "h2", "text": "E.7 Standardising Across Locations"}, {"t": "p", "text": "The entire purpose of the SeamFlow Operating System is to make this step possible. A facility expanding on the back of its Structure Plan SOPs and Section C KPIs can open a new location using the same documented processes, the same audit scorecard, and the same KPI dashboards \u2014 adapted only where local regulatory or staffing context genuinely requires it. This is what separates sustainable multi-site healthcare groups from single, founder-dependent facilities that struggle the moment they try to grow."}, {"t": "h2", "text": "E.8 A Phased Expansion Roadmap"}, {"t": "h3", "text": "Phase 1 \u2014 Readiness Confirmation (Month 1\u20132)"}, {"t": "p", "text": "Confirm the signals in Section E.2 against actual data, not optimism. Conduct a further Business Systems Audit cycle specifically to confirm sustained operational maturity before committing capital."}, {"t": "h3", "text": "Phase 2 \u2014 Site and Model Selection (Month 2\u20134)"}, {"t": "p", "text": "Select the expansion model and site using the criteria in Sections E.3 and E.4. Begin the regulatory application process in parallel, since licensing timelines are often the true bottleneck."}, {"t": "h3", "text": "Phase 3 \u2014 Build-Out and Systems Replication (Month 4\u20138)"}, {"t": "p", "text": "Fit out the new location, recruit and onboard staff per Section D, and install the full Structure Plan SOP set from day one \u2014 never plan to \u201cadd the SOPs later once things settle.\u201d"}, {"t": "h3", "text": "Phase 4 \u2014 Launch and Stabilisation (Month 8\u201312)"}, {"t": "p", "text": "Launch with close, hands-on oversight from experienced staff from the original location. Run the first Business Systems Audit at the new site within the first quarter of operation to establish its own baseline."}, {"t": "h3", "text": "Phase 5 \u2014 Independent Operation (Month 12+)"}, {"t": "p", "text": "Transition the new location to standard KPI and quarterly audit reporting alongside all other locations, and begin evaluating readiness for the next expansion."}]}, {"key": "audit_certification", "letter": "F", "title": "The Quarterly Audit Cycle & SeamFlow Standard Certification", "subtitle": "Closing the loop \u2014 how Clarity, Structure, and Growth stay alive together", "blocks": [{"t": "h2", "text": "F.1 Why This Section Exists"}, {"t": "p", "text": "Clarity diagnosed. Structure installed. Growth, so far, has covered brand, community, people, and expansion. But none of it survives without a mechanism that keeps checking whether the structure is actually holding. This final section is what makes the Growth Plan a genuine closed loop rather than three separate documents \u2014 it re-connects to the Clarity Plan's Business Systems Audit and turns it from a one-time diagnostic into a permanent operating rhythm."}, {"t": "h2", "text": "F.2 Running the Quarterly Audit Cycle"}, {"t": "numbered", "items": [{"text": "Re-run the full Business Systems Audit \u2014 the same 22-department, 264-question instrument used in the original Clarity Plan diagnostic \u2014 every quarter, on a fixed, calendared date."}, {"text": "Compare the new Operational Maturity Score and Maturity Tier directly against the previous quarter's result for every department, not just the facility-wide average."}, {"text": "For any department whose score falls, or whose score remains below 70%, revisit the specific Structure Plan SOPs for that department and determine whether the gap is a training issue, a resourcing issue, or an SOP that needs revision."}, {"text": "For any department sustaining a score of 76% or higher (Structured tier) across two consecutive quarters, formally recognise the achievement at the management meeting \u2014 sustained structure deserves the same visible recognition as any other strong performance."}, {"text": "Feed every quarterly finding back into the relevant Section C KPI review, so the audit cycle and the day-to-day KPI dashboard reinforce rather than duplicate each other."}, {"text": "Retain every quarterly audit result permanently, building a multi-year maturity trend line that becomes one of the most persuasive assets a facility can show an investor, partner, or acquiring group when the time comes to discuss expansion or sale."}]}, {"t": "h2", "text": "F.3 The SeamFlow Standard \u2014 A Trust Mark Built on Real Evidence"}, {"t": "p", "text": "A facility that sustains a Structured tier score (76% or above) across at least two consecutive quarterly audit cycles, with no department scoring below 60%, is eligible for the SeamFlow Standard \u2014 a recognition mark a facility can display to patients, HMOs, corporate partners, and regulators as evidence of consistently audited operational discipline."}, {"t": "bullets", "items": [{"lead": "Why this matters commercially:", "text": " no direct competitor in the Nigerian market currently offers a packaged, evidence-based operational certification for healthcare SMEs; a facility carrying the SeamFlow Standard is visibly different from one that simply claims to be well-run."}, {"lead": "Why this matters for brand trust:", "text": " the mark connects directly back to Section A: it is, in effect, the single most credible brand-trust asset this entire Growth Plan can produce, because it is backed by a real, repeatable, third-party-style measurement rather than a marketing claim."}, {"lead": "Maintaining integrity of the mark:", "text": " eligibility is re-confirmed every two quarters; a facility that falls below the threshold at a subsequent audit is given one further quarter to recover before the mark is suspended, keeping the certification meaningful rather than symbolic."}]}, {"t": "h2", "text": "F.4 Bringing It All Together"}, {"t": "p", "text": "A facility working through all three SeamFlow plans in sequence ends up with something rare in the Nigerian healthcare SME market: a documented diagnostic history, a complete library of department-level processes and SOPs, a live KPI dashboard across every function, a deliberate brand and community health strategy, a workforce built for retention rather than constant replacement, a clear-eyed view of if and when to expand, and a recurring audit discipline that keeps all of it honest. That is the complete SeamFlow Operating System \u2014 Clarity, Structure, and Growth, working as one system rather than three separate purchases."}]}];

let state = { screen:"home", sectionKey:null, deptIndex:null };

function render(){
  const app = document.getElementById("app");
  if(state.screen === "home") app.innerHTML = renderHome();
  else if(state.screen === "section") app.innerHTML = renderSection();
  else app.innerHTML = renderDept();
  attachHandlers();
  window.scrollTo(0,0);
}

function brandHeader(){
  return `
  <div class="hdr">
    <a href="../index.html" style="display:inline-block;font-size:11.5px;color:#B9C2DE;text-decoration:none;margin-bottom:10px;">&larr; seamflowconsulting.com</a>
    <div class="brand-row">
      <img src="data:image/png;base64,${ICON_B64}" alt="SeamFlow icon">
      <div>
        <div class="brand-name">SeamFlow</div>
        <div class="brand-sub">Consulting</div>
      </div>
    </div>
    <div class="tagline">Clarity. Structure. Growth.</div>
    <h1>The Growth Plan</h1>
    <p>Brand Trust \u00b7 Preventive Healthcare \u00b7 Performance \u00b7 People \u00b7 Expansion</p>
    <div class="plan-badge">
      <span style="color:#fff;font-size:12px;">You are viewing the</span>
      <span class="amt">Growth Plan \u2014 \u20a6350,000</span>
    </div>
  </div>`;
}

function renderHome(){
  return `
  ${brandHeader()}
  <div class="intro">
    <p>The Growth Plan is the third and final stage of the SeamFlow Operating System \u2014 what keeps a structured facility improving, trusted, well-staffed, and ready to expand. Tap any section below.</p>
  </div>
  <div class="section-nav">
    ${SECTIONS.map(s => `
      <div class="section-card" data-key="${s.key}">
        <div class="section-letter">${s.letter}</div>
        <div>
          <div class="sc-title">${s.title}</div>
          <div class="sc-sub">${s.subtitle}</div>
        </div>
        <div class="sc-arrow">\u203a</div>
      </div>`).join("")}
  </div>
  <p class="disclaimer">This Growth Plan should be adapted to your facility's specific size, specialty, licensing conditions, and local market, and reviewed periodically as your facility and Nigerian healthcare regulation evolve.</p>
  `;
}

function renderBlock(b){
  if(b.t === "h2") return `<div class="block-h2">${b.text}</div>`;
  if(b.t === "h3") return `<div class="block-h3">${b.text}</div>`;
  if(b.t === "p") return `<p class="block-p">${b.text}</p>`;
  if(b.t === "quote") return `<div class="block-quote">${b.text}</div>`;
  if(b.t === "bullets") return `<ul class="block-list">${b.items.map(i => `<li>${i.lead ? `<b>${i.lead}</b> ` : ""}${i.text}</li>`).join("")}</ul>`;
  if(b.t === "numbered") return `<ol class="block-list">${b.items.map(i => `<li>${i.lead ? `<b>${i.lead}</b> ` : ""}${i.text}</li>`).join("")}</ol>`;
  return "";
}

function renderSection(){
  const s = SECTIONS.find(x => x.key === state.sectionKey);
  let content = "";
  if(s.key === "kpi_dashboards"){
    content = `
      ${s.intro_blocks.map(renderBlock).join("")}
      <div class="dept-grid">
        ${s.departments.map((d,i) => `
          <div class="dept-chip" data-dept="${i}">
            <div>
              <div class="dc-name">${i+1}. ${d.name}</div>
              <div class="dc-meta">${d.type} \u00b7 5 KPIs</div>
            </div>
            <div class="dc-arrow">\u203a</div>
          </div>`).join("")}
      </div>
    `;
  } else {
    content = s.blocks.map(renderBlock).join("");
  }
  return `
  ${brandHeader()}
  <div class="detail-view">
    <button class="back-link" id="backBtn">\u2039 All sections</button>
    <div class="detail-eyebrow">Section ${s.letter}</div>
    <div class="detail-title">${s.title}</div>
    <div class="detail-sub">${s.subtitle}</div>
    ${content}
  </div>
  <p class="disclaimer">Growth Plan \u2014 SeamFlow Consulting.</p>
  `;
}

function renderDept(){
  const s = SECTIONS.find(x => x.key === "kpi_dashboards");
  const d = s.departments[state.deptIndex];
  return `
  ${brandHeader()}
  <div class="detail-view">
    <button class="back-link" id="backToSectionBtn">\u2039 All departments</button>
    <div class="detail-eyebrow">Section C \u2014 KPI Dashboards</div>
    <div class="detail-title">${d.name}</div>
    <div class="type-tag">${d.type}</div>
    <p class="block-p">${d.overview}</p>
    <div class="kpi-grid">
      ${d.kpis.map(k => `
        <div class="kpi-card">
          <div class="kc-badge">Target Benchmark</div>
          <div class="kc-value">${k[2]}</div>
          <div class="kc-name">${k[0]}</div>
          <div class="kc-def">${k[1]}</div>
          <div class="kc-meta">
            <span><b>Frequency</b> ${k[3]}</span>
            <span><b>Owner</b> ${k[4]}</span>
          </div>
        </div>`).join("")}
    </div>
  </div>
  <p class="disclaimer">Growth Plan \u2014 SeamFlow Consulting. Targets are starting points \u2014 adjust as your facility's own baseline data accumulates.</p>
  `;
}

function attachHandlers(){
  if(state.screen === "home"){
    document.querySelectorAll(".section-card").forEach(el => {
      el.onclick = () => { state.screen = "section"; state.sectionKey = el.getAttribute("data-key"); render(); };
    });
  } else if(state.screen === "section"){
    document.getElementById("backBtn").onclick = () => { state.screen = "home"; state.sectionKey = null; render(); };
    document.querySelectorAll(".dept-chip").forEach(el => {
      el.onclick = () => { state.screen = "dept"; state.deptIndex = parseInt(el.getAttribute("data-dept"),10); render(); };
    });
  } else {
    document.getElementById("backToSectionBtn").onclick = () => { state.screen = "section"; render(); };
  }
}

/* ===================== ACCESS GATE ===================== */
(function(){
  var STORAGE_KEY = "seamflow_unlocked_growth";
  var CORRECT_CODE = "GROWTH2026";
  var gate = document.getElementById('accessGate');

  function unlock(){
    gate.style.display = 'none';
    render();
  }

  try {
    if (localStorage.getItem(STORAGE_KEY) === 'true') { unlock(); }
  } catch(e) {}

  document.getElementById('gateSubmit').addEventListener('click', attempt);
  document.getElementById('gatePassword').addEventListener('keydown', function(e){
    if (e.key === 'Enter') attempt();
  });

  function attempt(){
    var val = document.getElementById('gatePassword').value.trim();
    if (val.toUpperCase() === CORRECT_CODE) {
      try { localStorage.setItem(STORAGE_KEY, 'true'); } catch(e){}
      unlock();
    } else {
      document.getElementById('gateError').style.display = 'block';
    }
  }
})();
</script>
