<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout | SeamFlow Consulting</title>
<link rel="icon" href="assets/icon.png">
<link rel="stylesheet" href="style.css">
<script src="https://js.paystack.co/v2/inline.js"></script>
</head>
<body>

<header class="site-header">
  <div class="wrap nav-row">
    <a href="index.html" class="nav-brand">
      <img src="assets/icon.png" alt="SeamFlow icon">
      <div><div class="nb-word">SeamFlow</div><div class="nb-sub">Consulting</div></div>
    </a>
  </div>
</header>

<section class="section" style="max-width:480px;margin:0 auto;">
  <div class="wrap-narrow">
    <div class="eyebrow">Checkout</div>
    <h1 id="planTitle" style="font-size:24px;">Loading plan…</h1>
    <p class="lede" id="planPrice" style="font-size:17px;"></p>

    <label for="email" style="display:block;font-weight:700;margin:20px 0 6px;">Email</label>
    <input type="email" id="email" placeholder="you@yourfacility.com"
      style="width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:8px;font-size:14.5px;font-family:inherit;margin-bottom:16px;">

    <button id="payBtn" class="btn btn-gold" style="width:100%;">Pay Now</button>
    <p id="status" style="margin-top:14px;font-size:13.5px;color:var(--grey);"></p>
  </div>
</section>

<script>
  const PLANS = {
    clarity:   { name: "The Clarity Plan",   priceKobo: 15000000, label: "₦150,000", toolPage: "tools/clarity-plan.html" },
    structure: { name: "The Structure Plan", priceKobo: 25000000, label: "₦250,000", toolPage: "tools/structure-plan.html" },
    growth:    { name: "The Growth Plan",    priceKobo: 35000000, label: "₦350,000", toolPage: "tools/growth-plan.html" },
    bundle:    { name: "All Three Plans",    priceKobo: 65000000, label: "₦650,000", toolPage: "services.html" }
  };

  const params = new URLSearchParams(location.search);
  const planKey = params.get("plan");
  const plan = PLANS[planKey];

  const titleEl = document.getElementById("planTitle");
  const priceEl = document.getElementById("planPrice");
  const statusEl = document.getElementById("status");
  const payBtn = document.getElementById("payBtn");

  if (!plan) {
    titleEl.textContent = "Unknown plan";
    payBtn.disabled = true;
  } else {
    titleEl.textContent = plan.name;
    priceEl.textContent = plan.label;
  }

  payBtn.addEventListener("click", () => {
    const email = document.getElementById("email").value.trim();
    if (!plan || !email || !email.includes("@")) {
      statusEl.textContent = "Enter a valid email first.";
      return;
    }
    payBtn.disabled = true;
    statusEl.textContent = "Opening secure payment window…";

    const popup = new PaystackPop();
    popup.newTransaction({
      key: "REPLACE_WITH_PAYSTACK_PUBLIC_TEST_KEY",
      email,
      amount: plan.priceKobo,
      currency: "NGN",
      metadata: { plan: planKey },
      onSuccess: async (transaction) => {
        statusEl.textContent = "Payment received. Confirming…";
        try {
          const res = await fetch("/api/verify-transaction", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ reference: transaction.reference, plan: planKey })
          });
          if (!res.ok) throw new Error("verify failed");
          const { token } = await res.json();
          location.href = `${plan.toolPage}?token=${token}&plan=${planKey}`;
        } catch (err) {
          statusEl.textContent = "We couldn't confirm the payment automatically. Contact us with your payment reference: " + transaction.reference;
          payBtn.disabled = false;
        }
      },
      onCancel: () => {
        statusEl.textContent = "Payment cancelled.";
        payBtn.disabled = false;
      }
    });
  });
</script>

</body>
</html>
