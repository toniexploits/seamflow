<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Customer Activity | SeamFlow Consulting</title>
<link rel="icon" href="assets/icon.png">
<style>
  :root{
    --navy:#021D4B; --navy-soft:#0C2C68; --gold:#EFCE58; --gold-light:#F8DE8A;
    --grey:#6B7280; --line:#E5E7EB; --bg:#FFFFFF; --panel:#F7F7F9;
    --danger:#C0392B; --warn:#F5A800; --ok:#1E8E5A;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:Calibri,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:#1A1A1A;}
  .wrap{max-width:900px;margin:0 auto;padding:0 20px 60px;}
  .hdr{background:linear-gradient(135deg,var(--navy) 0%, var(--navy-soft) 100%);color:#fff;padding:24px 20px;border-bottom:4px solid var(--gold);margin-bottom:28px;}
  .hdr .wrap{padding:0 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
  .hdr h1{margin:0;font-size:19px;}
  .hdr .sub{font-size:12.5px;color:#C9D0E8;}
  .btn{border:none;border-radius:8px;padding:10px 16px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit;}
  .btn-primary{background:var(--navy);color:#fff;}
  .btn-gold{background:var(--gold);color:var(--navy);}
  .btn-ghost{background:transparent;color:var(--navy);border:1.5px solid var(--line);}

  #gate{max-width:380px;margin:80px auto;text-align:center;padding:0 20px;}
  #gate h2{color:var(--navy);font-size:19px;margin-bottom:8px;}
  #gate p{color:var(--grey);font-size:13.5px;margin-bottom:20px;}
  #gate input{width:100%;padding:13px 14px;border-radius:8px;border:1.5px solid var(--line);font-size:15px;text-align:center;margin-bottom:14px;font-family:inherit;}
  #gate .err{color:var(--danger);font-size:12.5px;margin-top:10px;display:none;}

  .tabs{display:flex;gap:8px;margin-bottom:20px;border-bottom:1.5px solid var(--line);}
  .tab{background:none;border:none;padding:10px 4px;margin-right:16px;font-size:13.5px;font-weight:700;color:var(--grey);cursor:pointer;font-family:inherit;border-bottom:2.5px solid transparent;}
  .tab.active{color:var(--navy);border-bottom-color:var(--gold);}
  .usage-type{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:700;}
  .usage-type.access{background:#EFF1F8;color:var(--navy);}
  .usage-type.view{background:#FFFBF0;color:#9A7B12;}

  .grant-form{max-width:420px;}
  .grant-form .field{margin-bottom:14px;}
  .grant-form label{display:block;font-size:12.5px;font-weight:700;color:var(--navy);margin-bottom:6px;}
  .grant-form input[type=text],.grant-form input[type=email]{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;}
  .grant-form .checks{display:flex;gap:18px;}
  .grant-form .checks label{display:flex;align-items:center;gap:6px;font-weight:600;font-size:13.5px;color:#1A1A1A;text-transform:none;}
  .grant-links{margin-top:20px;border:1.5px solid var(--line);border-radius:10px;padding:14px 16px;}
  .grant-links .link-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;}
  .grant-links .link-row:last-child{border-bottom:none;}
  .grant-links code{font-size:12px;background:var(--panel);padding:3px 6px;border-radius:5px;word-break:break-all;}
  .grant-err{color:var(--danger);font-size:12.5px;margin-top:10px;display:none;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;font-size:11px;letter-spacing:0.5px;text-transform:uppercase;color:var(--grey);border-bottom:2px solid var(--line);padding:8px 10px;}
  td{padding:12px 10px;border-bottom:1px solid var(--line);}
  tr.row{cursor:pointer;}
  tr.row:hover{background:var(--panel);}
  .score-pill{display:inline-block;padding:3px 10px;border-radius:999px;font-weight:700;font-size:12.5px;}
  .empty{color:var(--grey);font-size:13.5px;padding:30px 0;text-align:center;}

  .report-hdr{border:1.5px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:20px;background:var(--panel);}
  .report-hdr .facility{font-size:19px;font-weight:800;color:var(--navy);margin-bottom:4px;}
  .report-hdr .meta{font-size:12.5px;color:var(--grey);line-height:1.6;}
  .gauge-wrap{display:flex;flex-direction:column;align-items:center;padding:16px 0;}
  .gauge-score{font-size:44px;font-weight:800;color:var(--navy);line-height:1;}
  .gauge-score span{font-size:18px;font-weight:700;color:var(--grey);}
  .maturity-badge{margin-top:12px;padding:8px 16px;border-radius:999px;font-size:13px;font-weight:700;}
  .priority-box{border-left:4px solid var(--danger);background:#FBEEEC;padding:14px 16px;border-radius:6px;margin:18px 0;}
  .priority-box .p-label{font-size:11.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--danger);margin-bottom:6px;}
  .priority-box ol{margin:0;padding-left:18px;}
  .priority-box li{font-size:13px;color:#3a1f1c;line-height:1.5;margin-bottom:4px;}
  .section-label{color:var(--navy);font-size:15px;margin:24px 0 12px;font-weight:700;}
  .domain-bar-row{margin-bottom:14px;}
  .domain-bar-head{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--navy);margin-bottom:6px;}
  .domain-bar-head .pct{color:var(--grey);font-weight:700;}
  .bar-track{height:9px;background:var(--line);border-radius:6px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:6px;}
  .actions{display:flex;gap:10px;margin-top:26px;}

  @media print{
    .hdr, .no-print{display:none !important;}
    .wrap{max-width:100%;padding:0;}
  }
</style>
</head>
<body>
<div class="hdr no-print"><div class="wrap">
  <div>
    <h1>Customer Activity</h1>
    <div class="sub">SeamFlow Consulting — internal</div>
  </div>
  <div id="hdrActions"></div>
</div></div>

<div id="gate">
  <h2>Enter admin key</h2>
  <p>This page is gated by the ADMIN_KEY set on the server. It isn't linked from anywhere else on the site.</p>
  <input type="password" id="keyInput" placeholder="Admin key">
  <button class="btn btn-gold" id="unlockBtn" style="width:100%;">Unlock</button>
  <div class="err" id="gateErr">Incorrect key. Try again.</div>
</div>

<div class="wrap" id="app" style="display:none;"></div>

<script>
const KEY_STORAGE = "seamflow_admin_key";
let adminKey = sessionStorage.getItem(KEY_STORAGE) || "";
let submissions = [];
let usageEvents = [];
let currentTab = "submissions"; // submissions | usage

async function api(path){
  const res = await fetch(path, { headers: { "x-admin-key": adminKey } });
  if(res.status === 401) throw new Error("unauthorized");
  if(!res.ok) throw new Error("request failed");
  return res.json();
}

async function apiPost(path, data){
  const res = await fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json", "x-admin-key": adminKey },
    body: JSON.stringify(data)
  });
  if(res.status === 401) throw new Error("unauthorized");
  const json = await res.json().catch(() => ({}));
  if(!res.ok) throw new Error(json.error || "request failed");
  return json;
}

function showGate(err){
  document.getElementById("gate").style.display = "block";
  document.getElementById("app").style.display = "none";
  document.getElementById("hdrActions").innerHTML = "";
  document.getElementById("gateErr").style.display = err ? "block" : "none";
}

function showApp(){
  document.getElementById("gate").style.display = "none";
  document.getElementById("app").style.display = "block";
}

async function loadList(){
  try{
    const [subsData, usageData] = await Promise.all([
      api("/api/admin-submissions"),
      api("/api/admin-usage")
    ]);
    submissions = subsData.items || [];
    usageEvents = usageData.items || [];
    showApp();
    renderTabView();
  }catch(e){
    sessionStorage.removeItem(KEY_STORAGE);
    showGate(true);
  }
}

function scoreColor(score){ if(score<40) return "#C0392B"; if(score<70) return "#F5A800"; return "#1E8E5A"; }

function tabsBar(){
  return `
    <div class="tabs">
      <button class="tab ${currentTab==='submissions'?'active':''}" data-tab="submissions">Audit Submissions (${submissions.length})</button>
      <button class="tab ${currentTab==='usage'?'active':''}" data-tab="usage">Tool Usage — Structure &amp; Growth (${usageEvents.length})</button>
      <button class="tab ${currentTab==='grant'?'active':''}" data-tab="grant">Grant Access</button>
    </div>`;
}

function attachTabHandlers(){
  document.querySelectorAll(".tab").forEach(el => {
    el.onclick = () => { currentTab = el.getAttribute("data-tab"); renderTabView(); };
  });
}

function renderTabView(){
  document.getElementById("hdrActions").innerHTML = "";
  if(currentTab === "submissions") renderList();
  else if(currentTab === "usage") renderUsageList();
  else renderGrantAccess();
}

function renderList(){
  const app = document.getElementById("app");
  const body = submissions.length === 0
    ? '<div class="empty">No audit submissions yet. They’ll show up here as visitors complete the Business Systems Audit.</div>'
    : `
    <table>
      <thead><tr><th>Submitted</th><th>Facility</th><th>Role</th><th>Email</th><th>Depts</th><th>Score</th></tr></thead>
      <tbody>
        ${submissions.map(s => `
          <tr class="row" data-id="${s.id}">
            <td>${new Date(s.submittedAt).toLocaleString()}</td>
            <td>${s.facility || "—"}</td>
            <td>${s.role || "—"}</td>
            <td>${s.email || "—"}</td>
            <td>${s.deptCount}</td>
            <td><span class="score-pill" style="background:${scoreColor(s.overall)}22;color:${scoreColor(s.overall)};">${s.overall}/100</span></td>
          </tr>`).join("")}
      </tbody>
    </table>`;
  app.innerHTML = tabsBar() + body;
  attachTabHandlers();
  document.querySelectorAll("tr.row").forEach(row => {
    row.onclick = () => loadDetail(row.getAttribute("data-id"));
  });
}

function renderUsageList(){
  const app = document.getElementById("app");
  const body = usageEvents.length === 0
    ? '<div class="empty">No Structure or Growth Plan activity yet. They’ll show up here as customers open those tools and browse sections.</div>'
    : `
    <table>
      <thead><tr><th>When</th><th>Email</th><th>Plan</th><th>Event</th><th>Viewed</th></tr></thead>
      <tbody>
        ${usageEvents.map(u => `
          <tr>
            <td>${new Date(u.at).toLocaleString()}</td>
            <td>${u.email || "—"}</td>
            <td style="text-transform:capitalize;">${u.plan}</td>
            <td><span class="usage-type ${u.type}">${u.type === "access" ? "Opened tool" : "Viewed"}</span></td>
            <td>${u.label || "—"}</td>
          </tr>`).join("")}
      </tbody>
    </table>`;
  app.innerHTML = tabsBar() + body;
  attachTabHandlers();
}

function renderGrantAccess(){
  const app = document.getElementById("app");
  app.innerHTML = tabsBar() + `
    <p style="color:var(--grey);font-size:13.5px;max-width:420px;margin-top:0;">Structure and Growth Plan access is granted after a scoping call — no automatic payment. Enter the client's details below to generate their access link(s).</p>
    <div class="grant-form">
      <div class="field">
        <label>Client email</label>
        <input type="email" id="grantEmail" placeholder="client@facility.com">
      </div>
      <div class="field">
        <label>Facility name (optional)</label>
        <input type="text" id="grantFacility" placeholder="e.g. Grace Specialist Hospital">
      </div>
      <div class="field">
        <label>Grant access to</label>
        <div class="checks">
          <label><input type="checkbox" id="grantStructure"> Structure Plan</label>
          <label><input type="checkbox" id="grantGrowth"> Growth Plan</label>
        </div>
      </div>
      <button class="btn btn-gold" id="generateGrantBtn">Generate Access Link</button>
      <div class="grant-err" id="grantErr"></div>
      <div class="grant-links" id="grantLinks" style="display:none;"></div>
    </div>`;
  attachTabHandlers();

  document.getElementById("generateGrantBtn").onclick = async () => {
    const email = document.getElementById("grantEmail").value.trim();
    const facility = document.getElementById("grantFacility").value.trim();
    const plans = [];
    if(document.getElementById("grantStructure").checked) plans.push("structure");
    if(document.getElementById("grantGrowth").checked) plans.push("growth");
    const errEl = document.getElementById("grantErr");
    errEl.style.display = "none";

    if(!email || !email.includes("@") || plans.length === 0){
      errEl.textContent = "Enter a valid email and select at least one plan.";
      errEl.style.display = "block";
      return;
    }
    try{
      const { links } = await apiPost("/api/admin-grant-access", { email, facility, plans });
      const linksEl = document.getElementById("grantLinks");
      linksEl.style.display = "block";
      linksEl.innerHTML = links.map(l => `
        <div class="link-row">
          <span style="text-transform:capitalize;font-weight:700;">${l.plan} Plan</span>
          <code>${location.origin}${l.url}</code>
        </div>`).join("");
    }catch(e){
      errEl.textContent = "Could not generate the link. Try again.";
      errEl.style.display = "block";
    }
  };
}

async function loadDetail(id){
  try{
    const record = await api(`/api/admin-submissions?id=${encodeURIComponent(id)}`);
    renderDetail(record);
  }catch(e){
    sessionStorage.removeItem(KEY_STORAGE);
    showGate(true);
  }
}

function renderDetail(r){
  const sorted = [...r.deptScores].sort((a,b) => a.score - b.score);
  const bottomThree = sorted.slice(0,3);
  const color = scoreColor(r.overall);

  document.getElementById("hdrActions").innerHTML = `<button class="btn btn-ghost no-print" id="backBtn">‹ All submissions</button>`;
  document.getElementById("app").innerHTML = `
    <div class="report-hdr">
      <div class="facility">${r.facility || "Untitled facility"}</div>
      <div class="meta">
        ${r.role || "Role not given"} · ${r.email || "no email on file"}<br>
        Submitted ${new Date(r.submittedAt).toLocaleString()} · ${r.selectedDepts.length} department${r.selectedDepts.length>1?"s":""} assessed
      </div>
    </div>

    <div class="gauge-wrap">
      <div class="gauge-score">${r.overall}<span>/100</span></div>
      <div class="maturity-badge" style="background:${color}22;border:1.5px solid ${color};color:${color};">
        ${r.tierLabel} <span style="opacity:0.7;font-weight:600;">· ${r.tierStage} tier</span>
      </div>
    </div>

    <div class="priority-box">
      <div class="p-label">Top Priority Gaps</div>
      <ol>${bottomThree.map(d => `<li><strong>${d.name}</strong> — ${d.score}/100</li>`).join("")}</ol>
    </div>

    <div class="section-label">Department Breakdown</div>
    ${sorted.map(d => `
      <div class="domain-bar-row">
        <div class="domain-bar-head"><span>${d.name}</span><span class="pct">${d.score}%</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${d.score}%;background:${scoreColor(d.score)};"></div></div>
      </div>`).join("")}

    <div class="actions no-print">
      <button class="btn btn-primary" id="printBtn">Print / Save as PDF</button>
    </div>`;

  document.getElementById("backBtn").onclick = () => { renderTabView(); };
  document.getElementById("printBtn").onclick = () => window.print();
}

document.getElementById("unlockBtn").onclick = async () => {
  adminKey = document.getElementById("keyInput").value.trim();
  if(!adminKey) return;
  sessionStorage.setItem(KEY_STORAGE, adminKey);
  await loadList();
};
document.getElementById("keyInput").addEventListener("keydown", (e) => {
  if(e.key === "Enter") document.getElementById("unlockBtn").click();
});

if(adminKey){ loadList(); } else { showGate(false); }
</script>
</body>
</html>
